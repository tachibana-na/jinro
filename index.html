<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人狼 GM代行</title>
<style>
:root{
  --bg-deep:#0a0f1c;
  --bg-panel:#131b2e;
  --bg-panel-light:#1b2440;
  --bg-panel-lighter:#232f52;
  --silver:#cdd6e5;
  --silver-dim:#8894ad;
  --blood:#b3311f;
  --blood-bright:#d64430;
  --amber:#d9a441;
  --mist:#6f93c9;
  --emerald:#6fcf97;
  --line:rgba(205,214,229,0.12);
  --font-display:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(111,147,201,0.10), transparent 60%),
    radial-gradient(ellipse 700px 400px at 90% 100%, rgba(179,49,31,0.08), transparent 60%),
    var(--bg-deep);
  color:var(--silver);
  font-family:var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
#app{width:100%; max-width:520px;}
.panel{
  background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-light));
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  position:relative;
  overflow:hidden;
}
.eyebrow{
  font-size:12px;
  letter-spacing:0.3em;
  color:var(--silver-dim);
  margin:0 0 8px;
  text-transform:uppercase;
}
h1,h2,h3{
  font-family:var(--font-display);
  font-weight:600;
  margin:0 0 6px;
  letter-spacing:0.02em;
}
h1{font-size:26px; color:var(--silver);}
h2{font-size:22px;}
h3{font-size:17px; color:var(--amber);}
p.lead{color:var(--silver-dim); font-size:14px; line-height:1.7; margin:0 0 20px;}
.moon{
  width:34px;height:34px;border-radius:50%;
  position:absolute; top:22px; right:22px;
  box-shadow: inset -8px -3px 0 0 var(--bg-panel), 0 0 18px rgba(217,164,65,0.35);
  background:var(--amber);
}
.daymark{
  position:absolute; top:26px; right:66px;
  font-family:var(--font-display); font-size:12px; letter-spacing:0.15em; color:var(--silver-dim);
}
.row{display:flex; align-items:center; gap:10px;}
.stepper{
  display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0 22px;
}
.stepper button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel-lighter); color:var(--silver);
  font-size:20px; cursor:pointer;
}
.stepper .val{font-family:var(--font-display); font-size:28px; min-width:54px; text-align:center;}
label{display:block; font-size:12px; color:var(--silver-dim); letter-spacing:0.08em; margin:18px 0 8px;}
input[type=text]{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px; font-family:var(--font-body);
}
input[type=text]:focus{outline:1px solid var(--mist);}
.namegrid{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; padding-right:2px; margin-bottom:6px;}
.nameitem{display:flex; align-items:center; gap:10px;}
.nameitem .idx{width:24px; text-align:right; font-size:12px; color:var(--silver-dim); font-family:var(--font-display);}
.btn{
  display:block; width:100%; text-align:center;
  padding:16px 18px; border-radius:14px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver);
  font-family:var(--font-body); font-size:16px; font-weight:600; letter-spacing:0.02em;
  cursor:pointer; margin-top:10px; transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(180deg, var(--mist), #4c6ea3); border-color:transparent; color:#0a0f1c;}
.btn-danger{background:linear-gradient(180deg, var(--blood-bright), var(--blood)); border-color:transparent; color:#fff;}
.btn-ghost{background:transparent;}
.btn-sub{font-size:12px; padding:10px; color:var(--silver-dim);}
.hint{font-size:12px; color:var(--silver-dim); margin-top:4px; line-height:1.6;}

.callwrap{text-align:center; padding:40px 10px;}
.callwrap .who{font-family:var(--font-display); font-size:30px; margin:10px 0 4px; color:var(--silver);}
.callwrap .msg{color:var(--silver-dim); font-size:14px; margin-bottom:26px; line-height:1.7;}

.card3d{perspective:1200px; margin:10px 0 20px;}
.cardface{
  min-height:180px; border-radius:16px; padding:26px 22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  border:1px solid var(--line);
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 60%), var(--bg-panel-lighter);
}
.cardface .rolename{font-family:var(--font-display); font-size:30px; margin:6px 0; letter-spacing:0.06em;}
.cardface .roledesc{font-size:13px; color:var(--silver-dim); line-height:1.8; margin-top:8px;}
.roleicon{font-size:40px; line-height:1;}

.playergrid{display:flex; flex-direction:column; gap:8px; margin:14px 0 6px;}
.pbtn{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px;
  cursor:pointer;
}
.pbtn.selected{border-color:var(--amber); background:rgba(217,164,65,0.14);}
.pbtn.dead{opacity:0.35; text-decoration:line-through; pointer-events:none; cursor:default;}
.pbtn.locked{opacity:0.4; pointer-events:none; cursor:default;}
.pbtn .tag{font-size:11px; color:var(--silver-dim);}

.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; letter-spacing:0.08em; border:1px solid var(--line); color:var(--silver-dim);}
.badge.wolf{color:#ffb3a4; border-color:rgba(214,68,48,0.5); background:rgba(214,68,48,0.1);}
.badge.villager{color:var(--amber); border-color:rgba(217,164,65,0.4); background:rgba(217,164,65,0.08);}
.badge.seer{color:var(--mist); border-color:rgba(111,147,201,0.4); background:rgba(111,147,201,0.08);}
.badge.hunter{color:var(--silver); border-color:var(--line); background:rgba(205,214,229,0.06);}
.badge.president{color:var(--emerald); border-color:rgba(111,207,151,0.45); background:rgba(111,207,151,0.09);}
.badge.madman{color:#c9a8ff; border-color:rgba(169,139,217,0.5); background:rgba(169,139,217,0.1);}
.badge.paparazzi{color:#ffb3a4; border-color:rgba(214,68,48,0.5); background:rgba(214,68,48,0.1);}
.lockedgrid{opacity:.45; pointer-events:none;}
.lockhint{color:var(--amber);}
select{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px; font-family:var(--font-body);
}
.itolist{display:flex; flex-direction:column; gap:8px; margin:8px 0;}
.itorow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg-panel-lighter);}
.itorank{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:rgba(205,214,229,0.12); font-size:12px; color:var(--silver-dim); font-family:var(--font-display);}
.itobtn{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel); color:var(--silver); font-size:18px; cursor:pointer; padding:0;}
.itobtn:disabled{opacity:.25; cursor:default;}
.itonum{font-family:var(--font-display); font-size:22px; color:var(--silver);}
.pdrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg-panel-lighter); margin-bottom:8px; cursor:pointer; font-size:14px; line-height:1.5;}
.pdrow.off .pdtext{color:var(--silver-dim); text-decoration:line-through;}
.sw{width:44px; height:26px; border-radius:999px; background:rgba(205,214,229,0.18); position:relative; flex-shrink:0; transition:background .15s;}
.sw::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--silver); transition:left .15s;}
.sw.on{background:var(--mist);}
.sw.on::after{left:21px; background:#0a0f1c;}
.resultrow.good{border-color:rgba(111,207,151,0.5); background:rgba(111,207,151,0.08);}
.resultrow.bad{border-color:rgba(214,68,48,0.6); background:rgba(214,68,48,0.12);}

.chipwrap{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--bg-panel-lighter); border:1px solid var(--line); font-size:13px;}
.chip .x{cursor:pointer; color:var(--silver-dim);}
.chip.pick{cursor:pointer; padding:9px 16px; font-size:14px;}
.chip.sel{border-color:var(--amber); background:rgba(217,164,65,0.16); color:var(--silver);}
.backlink{display:inline-block; background:none; border:none; color:var(--silver-dim); font-size:12px; cursor:pointer; margin-bottom:16px; padding:0; font-family:var(--font-body);}
.menubtn{text-align:left;}
.menubtn .sub{display:block; font-size:12px; font-weight:400; color:rgba(255,255,255,0.75); margin-top:2px;}
.barrow{margin-bottom:14px;}
.barrow .bartrack{height:10px; border-radius:6px; background:var(--bg-panel-lighter); overflow:hidden;}
.barrow .barfill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--mist), #4c6ea3);}
textarea{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px; font-family:var(--font-body); resize:vertical;
}
textarea:focus{outline:1px solid var(--mist);}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.pop-in{animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;}
.logpanel{
  margin-top:14px; padding:14px 16px; border-radius:16px;
  background:rgba(19,27,46,0.85); border:1px solid var(--line);
  max-height:240px; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.logpanel h4{margin:0 0 8px; font-size:12px; letter-spacing:0.2em; color:var(--silver-dim); font-weight:600;}
.logrow{font-size:13px; line-height:1.6; padding:6px 0; border-top:1px solid var(--line); color:var(--silver);}
.logrow:first-of-type{border-top:none;}
.logrow .logsub{display:block; font-size:11px; color:var(--silver-dim); line-height:1.5;}
.errtext{color:#ffb3a4; font-size:13px; line-height:1.6; margin:10px 0 0;}

.divider{height:1px; background:var(--line); margin:20px 0;}
.resultlist{display:flex; flex-direction:column; gap:8px; margin:12px 0 6px;}
.resultrow{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px; background:var(--bg-panel-lighter); border:1px solid var(--line);}
.resultrow.dead .rname{text-decoration:line-through; color:var(--silver-dim);}
.center{text-align:center;}
.small{font-size:12px; color:var(--silver-dim);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- role definitions ---------- */
const ROLES = {
  wolf:     {name:'人狼',   emoji:'🐺', cls:'wolf',     desc:'夜、他の人狼と目を見交わし、村人を一人選んで襲撃する。正体を最後まで隠し通せ。'},
  villager: {name:'村人',   emoji:'👤', cls:'villager', desc:'特別な力はない。話し合いと観察だけを頼りに、人狼を見つけ出せ。'},
  seer:     {name:'占い師', emoji:'🔮', cls:'seer',     desc:'夜ごとに一人を選び、その者が人狼かどうかを見抜くことができる。'},
  hunter:   {name:'狩人',   emoji:'🛡️', cls:'hunter',   desc:'夜ごとに一人を選び、人狼の凶刃から守ることができる。'},
  president:{name:'社長',   emoji:'🎩', cls:'president',desc:'みんなで話し合い助け合おう。物忘れは激しく、言うことはコロコロと変わる。追放は私が決める。'},
  madman:   {name:'狂人',   emoji:'🃏', cls:'madman',   desc:'あなたは人狼陣営だが、人狼が誰かは知らない。人狼もあなたが誰かを知らない。特別な能力はないが、人狼陣営の勝利のために村を惑わせ。'},
  paparazzi:{name:'パパラッチ', emoji:'📸', cls:'paparazzi', desc:'占い師のように夜ごとに誰かの正体を調べられるが、あなたは人狼陣営に属している。人狼が誰かは知らず、人狼もあなたが誰かを知らない。占いでは人狼だと見抜かれない。'}
};

function calcWolfCount(n){ return Math.max(1, Math.floor(n/4)); }
// 各役職の合計が人数を超えないように、村人が最低0人になる範囲でクランプする
function clampRoleCounts(n, wolf, seer, hunter, president, madman, paparazzi){
  wolf = Math.max(1, wolf);
  seer = Math.max(0, seer);
  hunter = Math.max(0, hunter);
  president = Math.min(1, Math.max(0, president));
  madman = Math.max(0, madman);
  paparazzi = Math.max(0, paparazzi);
  let total = wolf + seer + hunter + president + madman + paparazzi;
  // 超過分は 狂人→狩人→占い師→社長→人狼(1人は残す) の順に削る
  while(total > n && paparazzi > 0){ paparazzi--; total--; }
  while(total > n && madman > 0){ madman--; total--; }
  while(total > n && hunter > 0){ hunter--; total--; }
  while(total > n && seer > 0){ seer--; total--; }
  while(total > n && president > 0){ president--; total--; }
  while(total > n && wolf > 1){ wolf--; total--; }
  return {wolf, seer, hunter, president, madman, paparazzi};
}

/* ---------- 名前・設定の保持(ページを再読み込みするまで有効) ----------
   ・プレイヤー名は全ゲーム共通。どのゲームで入力しても、他のゲームの設定画面に引き継がれる
   ・各ゲームの設定(人数・ジャンル・制限時間など)は、トップに戻って入り直しても保持される */
const sharedNames = [];
function getNames(n){
  return Array.from({length:n}, (_,i)=> sharedNames[i] !== undefined ? sharedNames[i] : 'プレイヤー'+(i+1));
}
function setSharedName(i, v){ sharedNames[i] = v; }
function carrySettings(prev, next, keys){
  if(prev){
    keys.forEach(k=>{
      if(prev[k] !== undefined) next[k] = Array.isArray(prev[k]) ? [...prev[k]] : prev[k];
    });
  }
  if(next.names && next.n) next.names = getNames(next.n);
  return next;
}

/* ---------- state ---------- */
let appMode = 'top'; // top | jinro | lottery | survey_choice | survey_free
let state = null;
function freshSetup(){
  const n = 8;
  return {
    screen:'setup',
    n,
    wolfCount: calcWolfCount(n),
    seerCount: 1,
    hunterCount: 1,
    presidentCount: 0,
    madmanCount: 0,
    paparazziCount: 0,
    revealOnExecution: false,  // 追放されたプレイヤーの役職をその場で公開するか
    revealOnAttack: false,     // 襲撃されたプレイヤーの役職をその場で公開するか
    pendingQueue: null,        // 次の夜の行動順(ランダム)
    names: getNames(n),
    players: [],
    confirmIdx:0,
    confirmPhase:'call',
    night:{ day:1, queue:[], qIdx:0, phase:'call', wolfTarget:null, seerTarget:null, seerResult:null, hunterTarget:null, villagerDummy:null, paparazziTarget:null, lockUntil:0 },
    lastHunterProtect:null,
    hunterConsecutive:true,    // 狩人が前夜と同じ人を続けて護衛できるか
    lastVictim:null,
    voteIdx:0,
    voteQueueIds:[],
    votes:{},
    lastExecuted:null,
    tieNote:false,
    executionNote:null,
    voteCandidates:null,   // 再投票時の投票対象(同率1位)のID配列。通常の投票ではnull
    revoteRound:0,         // その日の再投票の回数
    revoteInfo:null,
    log:[],                // 全員に公開されている情報のみを記録する
    setupError:null,
    winner:null,
    winReason:null
  };
}
state = freshSetup();
const MAX_REVOTES = 3;     // 再投票でも決まらない場合の上限(超えたら抽選)

function addLog(text, sub){ state.log.push({text, sub: sub||''}); }
function renderLogPanel(){
  if(state.screen==='setup' || state.log.length===0) return '';
  const rows = [...state.log].reverse().map(e=>`
    <div class="logrow">${escapeHtml(e.text)}${e.sub ? `<span class="logsub">${escapeHtml(e.sub)}</span>` : ''}</div>`).join('');
  return `<div class="logpanel"><h4>公開ログ(新しい順)</h4>${rows}</div>`;
}

function alivePlayers(){ return state.players.filter(p=>p.alive); }
function aliveWolfSide(){ return alivePlayers().filter(p=>p.role==='wolf' || p.role==='paparazzi'); }
function playerById(id){ return state.players.find(p=>p.id===id); }

/* ---------- render dispatch ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(appMode === 'top'){ html = screenTop(); }
  else if(appMode === 'lottery'){ html = renderLotteryScreen(); }
  else if(appMode === 'talk_theme'){ html = renderTalkThemeScreen(); }
  else if(appMode === 'insider'){ html = renderInsiderScreen(); }
  else if(appMode === 'wordwolf'){ html = renderWwScreen(); }
  else if(appMode === 'ito'){ html = renderItoScreen(); }
  else if(appMode === 'pd'){ html = renderPdScreen(); }
  else if(appMode === 'survey_choice'){ html = renderSurveyChoiceScreen(); }
  else if(appMode === 'survey_free'){ html = renderSurveyFreeScreen(); }
  else { html = renderJinroScreen() + renderLogPanel(); }
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function renderJinroScreen(){
  switch(state.screen){
    case 'setup': return screenSetup();
    case 'confirm': return screenConfirm();
    case 'night': return screenNight();
    case 'morning': return screenMorning();
    case 'day_vote': return screenVote();
    case 'revote_notice': return screenRevoteNotice();
    case 'execution': return screenExecution();
    case 'gameover': return screenGameOver();
    default: return screenSetup();
  }
}

/* ---------- TOP MENU ---------- */
function screenTop(){
  return `
  <div class="panel">
    <div class="eyebrow">レクリエーション</div>
    <h1>なにで遊ぶ?</h1>
    <p class="lead">端末を1台、参加者で回して遊べるミニゲーム集です。</p>
    <button class="btn btn-primary menubtn" onclick="enterJinro()">🐺 人狼<span class="sub">正体を隠して村を守れ・話し合いと投票のゲーム</span></button>
    <button class="btn btn-primary menubtn" onclick="enterLottery()">🎯 抽選<span class="sub">入力した候補からランダムに選ぶ・チーム分けも可能</span></button>
    <button class="btn btn-primary menubtn" onclick="enterInsider()">🕵️ インサイダーゲーム<span class="sub">お題を当てながら、お題を知る裏切り者を探す</span></button>
    <button class="btn btn-primary menubtn" onclick="enterWw()">🎭 ワードウルフ<span class="sub">少し違うお題を持つウルフを会話で探す</span></button>
    <button class="btn btn-primary menubtn" onclick="enterIto()">🔢 価値観合わせゲーム<span class="sub">お題に沿って数字の大きい順に並べる(ito風)</span></button>
    <button class="btn btn-primary menubtn" onclick="enterPd()">🎲 偏見暴露ゲーム<span class="sub">「〜そうな人」を名指し。お題は1/2の確率で公開(パラノイア風)</span></button>
    <button class="btn btn-primary menubtn" onclick="enterTalkTheme()">💬 トークテーマ<span class="sub">会話のきっかけになるお題をランダムに引く</span></button>
    <button class="btn btn-primary menubtn" onclick="enterSurveyChoice()">🗳️ アンケート(選択式)<span class="sub">選択肢から選んでもらい、匿名で集計</span></button>
    <button class="btn btn-primary menubtn" onclick="enterSurveyFree()">✏️ アンケート(自由入力)<span class="sub">自由記述で回答してもらい、匿名で一覧表示</span></button>
  </div>`;
}
const JINRO_KEYS = ['n','wolfCount','seerCount','hunterCount','presidentCount','madmanCount','paparazziCount','revealOnExecution','revealOnAttack','hunterConsecutive'];
function enterJinro(){ appMode='jinro'; state = carrySettings(state, freshSetup(), JINRO_KEYS); render(); }
function enterLottery(){ appMode='lottery'; lotteryState = carrySettings(lotteryState, freshLottery(), ['mode','items','teamCount']); render(); }
function enterSurveyChoice(){ appMode='survey_choice'; surveyChoiceState = carrySettings(surveyChoiceState, freshSurveyChoice(), ['question','options','n']); render(); }

function changeN(d){
  const n = Math.min(15, Math.max(5, state.n + d));
  if(n === state.n) return;
  state.setupError = null;
  state.n = n;
  state.names = getNames(n);
  const c = clampRoleCounts(n, state.wolfCount, state.seerCount, state.hunterCount, state.presidentCount, state.madmanCount, state.paparazziCount);
  state.wolfCount = c.wolf; state.seerCount = c.seer; state.hunterCount = c.hunter; state.presidentCount = c.president; state.madmanCount = c.madman; state.paparazziCount = c.paparazzi;
  render();
}
function changeRole(role, d){
  const w = state.wolfCount + (role==='wolf'?d:0);
  const s = state.seerCount + (role==='seer'?d:0);
  const h = state.hunterCount + (role==='hunter'?d:0);
  const pr = state.presidentCount + (role==='president'?d:0);
  const md = state.madmanCount + (role==='madman'?d:0);
  const pp = state.paparazziCount + (role==='paparazzi'?d:0);
  if(w < 1 || s < 0 || h < 0 || pr < 0 || pr > 1 || md < 0 || pp < 0) return;
  if(w + s + h + pr + md + pp > state.n) return;
  state.setupError = null;
  state.wolfCount = w; state.seerCount = s; state.hunterCount = h; state.presidentCount = pr; state.madmanCount = md; state.paparazziCount = pp;
  render();
}
function setHunterConsecutive(on){ state.hunterConsecutive = on; render(); }
function setReveal(kind, on){
  if(kind === 'execution') state.revealOnExecution = on;
  else state.revealOnAttack = on;
  render();
}
function setName(i,v){ state.names[i] = v; setSharedName(i, v); }

function startGame(){
  const n = state.n, w = state.wolfCount, s = state.seerCount, h = state.hunterCount, pr = state.presidentCount, md = state.madmanCount, pp = state.paparazziCount;
  const names = state.names.map((nm,i)=> nm.trim() || ('プレイヤー'+(i+1)));

  // 名前に「山口」を含む参加者は人狼陣営(人狼・狂人・パパラッチ)にならない
  const wolfSideRoles = [];
  for(let i=0;i<w;i++) wolfSideRoles.push('wolf');
  for(let i=0;i<md;i++) wolfSideRoles.push('madman');
  for(let i=0;i<pp;i++) wolfSideRoles.push('paparazzi');
  const eligible = names.map((_,i)=>i).filter(i=>!isYamaguchi(names[i]));
  if(eligible.length < wolfSideRoles.length){
    state.setupError = `人狼陣営の役職を割り当てられる参加者が足りません(候補${eligible.length}人/人狼陣営${wolfSideRoles.length}人)。人狼・狂人・パパラッチの人数を減らしてください。`;
    render();
    return;
  }
  state.setupError = null;

  // 配役を1回分つくる(人狼陣営は条件を満たす参加者から、残りは空き席へランダムに)
  const assignOnce = () => {
    const pool = [...eligible];
    shuffle(pool);
    const r = new Array(n).fill(null);
    wolfSideRoles.forEach((role, k)=>{ r[pool[k]] = role; });
    const others = [];
    for(let i=0;i<s;i++) others.push('seer');
    for(let i=0;i<h;i++) others.push('hunter');
    for(let i=0;i<pr;i++) others.push('president');
    while(others.length < n - wolfSideRoles.length) others.push('villager');
    shuffle(others);
    let k2 = 0;
    for(let i=0;i<n;i++){ if(r[i] === null) r[i] = others[k2++]; }
    return r;
  };
  // 同じ人が同じ特別役を3連続で引かないようにする
  const roles = drawRolesWithRunLimit(assignOnce, jinroRoleHistory, names, JINRO_MAX_RUN);
  recordRoles(jinroRoleHistory, names, roles);

  state.players = names.map((nm,i)=>({id:i, name: nm, role: roles[i], alive:true, deathCause:null}));
  state.log = [];
  addLog(`ゲーム開始(参加${n}人)`);
  state.pendingQueue = shuffledAliveIds();
  state.confirmIdx = 0;
  state.confirmPhase = 'call';
  state.screen = 'confirm';
  render();
}
/* 役職の連続防止(同じ人が同じ役を続けて引かないようにする)
   history[名前] = これまでの役職(新しいものが後ろ)。maxRun[役職] = 連続できる最大回数(未指定の役職は無制限)。
   ・毎回の配役を無作為に作り、制限に触れたら引き直す(制限を満たす配役の中では一様なランダム)
   ・制限を満たす配役が作れない場合(人数・役職構成の都合)は、制限を緩めて最後に引いた配役を使う */
function runExceeded(hist, role, maxRun){
  if(!maxRun) return false;
  const h = hist || [];
  if(h.length < maxRun) return false;
  return h.slice(-maxRun).every(r => r === role);
}
function violatesRunRule(history, names, roles, maxRunMap){
  return names.some((nm,i)=> runExceeded(history[nm], roles[i], maxRunMap[roles[i]]));
}
function drawRolesWithRunLimit(drawFn, history, names, maxRunMap, tries){
  let last = null;
  for(let t=0; t<(tries||1000); t++){
    last = drawFn();
    if(!violatesRunRule(history, names, last, maxRunMap)) return last;
  }
  return last;
}
function recordRoles(history, names, roles){
  names.forEach((nm,i)=>{
    (history[nm] = history[nm] || []).push(roles[i]);
    if(history[nm].length > 6) history[nm].shift();
  });
}
// ゲームごとの履歴(ページを開いている間は保持)と、連続できる最大回数
const jinroRoleHistory = {};
const JINRO_MAX_RUN = {wolf:2, seer:2, hunter:2, president:2, madman:2, paparazzi:2};   // 村人は対象外(多数派のため)
const insiderRoleHistory = {};
let insiderLastMasterName = null;     // 直前のゲームのマスター(「順番」で次の人を決めるのに使う)
const INSIDER_MAX_RUN = {master:1, insider:2};                                           // マスターは2連続不可、インサイダーは3連続不可(市民は対象外)
const wwRoleHistory = {};
const WW_MAX_RUN = {wolf:2};                                                             // ウルフは3連続不可(市民は対象外)
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function confirmReveal(){ state.confirmPhase = 'reveal'; render(); }
function confirmDone(){ state.confirmPhase = 'pass'; render(); }
function confirmAdvance(){
  if(state.confirmIdx+1 < state.players.length){
    state.confirmIdx += 1;
    state.confirmPhase = 'call';
    render();
  } else {
    beginNight();
  }
}

/* ---------- NIGHT ---------- */
function beginNight(){
  // 全プレイヤーが同じ手順で端末を回す(誰が特別な役職か分からないようにするため)。順番は毎晩ランダム
  state.night.queue = state.pendingQueue || shuffledAliveIds();
  state.pendingQueue = null;
  state.night.qIdx = 0;
  state.night.phase = 'call';
  state.night.wolfTarget = null;
  state.night.seerTarget = null;
  state.night.paparazziTarget = null;
  state.night.seerResult = null;
  state.night.hunterTarget = null;
  state.night.villagerDummy = null;
  state.screen = 'night';
  render();
}
// 「山口」「やまぐち」「ヤマグチ」(半角カナ・ローマ字含む)を名前に含むか判定する
function isYamaguchi(name){
  const t = String(name).normalize('NFKC').toLowerCase();                       // 半角カナ→全角、全角英字→半角、英字→小文字
  const hira = t.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));  // カタカナ→ひらがな
  return hira.includes('山口') || hira.includes('やまぐち') || hira.includes('yamaguchi');
}
function shuffledAliveIds(){
  const q = alivePlayers().map(p=>p.id);
  shuffle(q);
  return q;
}
/* 行動画面(プレイヤーを選ぶ画面)は表示から5秒間ボタンを押せない。
   役職によって操作にかかる時間が違うことで、役職が推測されるのを防ぐ。 */
const ACT_LOCK_MS = 5000;
let actLockTimer = null;
function actLocked(){ return state.screen==='night' && state.night.phase==='act' && Date.now() < (state.night.lockUntil||0); }
function startActLock(){
  state.night.lockUntil = Date.now() + ACT_LOCK_MS;
  if(actLockTimer) clearInterval(actLockTimer);
  actLockTimer = setInterval(tickActLock, 200);
}
function tickActLock(){
  if(!(state.screen==='night' && state.night.phase==='act')){ clearInterval(actLockTimer); actLockTimer = null; return; }
  const remain = (state.night.lockUntil||0) - Date.now();
  const hint = document.getElementById('lockhint');
  if(remain > 0){
    if(hint) hint.textContent = `あと${Math.ceil(remain/1000)}秒で選べるようになります`;
    return;
  }
  clearInterval(actLockTimer); actLockTimer = null;
  if(hint) hint.remove();
  const grid = document.getElementById('actgrid');
  if(grid) grid.classList.remove('lockedgrid');
  const btn = document.getElementById('actDecideBtn');
  if(btn){
    const f = btn.getAttribute('data-field');
    const needTarget = f && state.night[f] === null;
    btn.disabled = !!needTarget;
    btn.style.opacity = needTarget ? '.4' : '1';
  }
}
function actGridAttrs(){ return `id="actgrid" class="playergrid${actLocked() ? ' lockedgrid' : ''}"`; }
function actHint(){ return actLocked() ? `<p class="hint lockhint" id="lockhint">あと${Math.ceil(((state.night.lockUntil||0)-Date.now())/1000)}秒で選べるようになります</p>` : ''; }
function actBtnAttrs(field){
  const dis = actLocked() || (field && state.night[field] === null);
  return `id="actDecideBtn" data-field="${field}" ${dis ? 'disabled style="opacity:.4"' : ''}`;
}
function aliveOfRole(role){ return state.players.find(p=>p.alive && p.role===role); }

function screenNight(){
  const p = playerById(state.night.queue[state.night.qIdx]);
  const role = p.role;
  const phase = state.night.phase;

  if(phase === 'call'){
    const eyebrow = `${moonMark()}<div class="eyebrow">夜がふける ${state.night.qIdx+1} / ${state.night.queue.length}</div>`;
    return callScreen(eyebrow, p, 'nightAct()', '確認する');
  }

  if(phase === 'act'){
    if(role === 'villager' || role === 'president' || role === 'madman'){
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>targetRow(q, state.night.villagerDummy, `pick('villagerDummy', ${q.id})`, null)).join('');
      return `
      <div class="panel">
        <div class="eyebrow">夜の行動</div>
        <h3>誰かを選んでください</h3>
        <p class="hint">あなたには特別な夜の行動はありません。この選択に意味はありません。誰でもよいので一人選んで進んでください。</p>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-primary" ${actBtnAttrs('villagerDummy')} onclick="nightConfirmAct()">決定</button>
      </div>`;
    }
    if(role === 'wolf'){
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>{
        let disabledReason = null;
        if(q.alive && q.role==='wolf') disabledReason = '人狼';
        return targetRow(q, state.night.wolfTarget, `pick('wolfTarget', ${q.id})`, disabledReason);
      }).join('');
      return `
      <div class="panel">
        <div class="eyebrow">人狼の襲撃先</div>
        <h3>誰を襲いますか?</h3>
        <p class="hint">あなたより先に他の人狼が襲撃先を選んでいれば、それに従うか襲撃先を変えることが出来ます。最後の人狼が選んだプレイヤーを襲撃します。</p>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-danger" ${actBtnAttrs('wolfTarget')} onclick="nightConfirmAct()">この人を襲う</button>
      </div>`;
    }
    if(role === 'seer' || role === 'paparazzi'){
      const field = role==='paparazzi' ? 'paparazziTarget' : 'seerTarget';
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>targetRow(q, state.night[field], `pick('${field}', ${q.id})`, null)).join('');
      return `
      <div class="panel">
        <div class="eyebrow">${role==='paparazzi' ? 'パパラッチの目' : '占い師の力'}</div>
        <h3>誰を調べますか?</h3>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-primary" ${actBtnAttrs(field)} onclick="nightConfirmAct()">調べる</button>
      </div>`;
    }
    // hunter(自分自身も対象に含む)
    const lastP = state.lastHunterProtect !== null ? playerById(state.lastHunterProtect) : null;
    const blockLast = !state.hunterConsecutive && lastP && lastP.alive;   // 連続護衛が禁止で、前回の対象がまだ生きている
    const rows = state.players.map(q=>{
      const isLast = state.lastHunterProtect === q.id;
      const reason = (!state.hunterConsecutive && isLast) ? '前回護衛(連続不可)' : null;
      const note = (state.hunterConsecutive && isLast) ? '前回護衛' : null;
      return targetRow(q, state.night.hunterTarget, `pick('hunterTarget', ${q.id})`, reason, note);
    }).join('');
    return `
    <div class="panel">
      <div class="eyebrow">狩人の力</div>
      <h3>誰を守りますか?</h3>
      ${blockLast ? `<p class="hint">前の夜に守った${escapeHtml(lastP.name)}さんは、続けて守れません。</p>` : ''}
      ${actHint()}
      <div ${actGridAttrs()}>${rows}</div>
      <button class="btn btn-primary" ${actBtnAttrs('hunterTarget')} onclick="nightConfirmAct()">守る</button>
    </div>`;
  }

  if(phase === 'result'){
    if(role === 'seer' || role === 'paparazzi'){
      const field = role==='paparazzi' ? 'paparazziTarget' : 'seerTarget';
      const t = playerById(state.night[field]);
      const isWolf = t.role === 'wolf';
      return `
      <div class="panel">
        <div class="card3d">
          <div class="cardface">
            <div class="roleicon">${isWolf?'🐺':'✨'}</div>
            <div class="rolename">${escapeHtml(t.name)} さんは</div>
            <div class="roledesc" style="font-size:18px; color:${isWolf?'#ffb3a4':'var(--silver)'}">${isWolf?'人狼である':'人狼ではない'}</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="nightPass()">${san(p)}:確認した</button>
      </div>`;
    }
    // villager / wolf / hunter / 社長 は同じ見た目の確認画面(誰が何をしたか分からないようにする)
    const label = role==='wolf' ? '選択を決めた' : role==='hunter' ? '選択を決めた' : '確認した';
    return `
    <div class="panel callwrap">
      <div class="who">${label}</div>
      <div class="msg">この画面の内容は誰にも明かさないでください。</div>
      <button class="btn btn-primary" onclick="nightPass()">${san(p)}:確認した</button>
    </div>`;
  }

  // phase === 'pass'
  const nextIdx = state.night.qIdx+1;
  const hasNext = nextIdx < state.night.queue.length;
  if(hasNext){
    const nextP = playerById(state.night.queue[nextIdx]);
    return passScreen(`${moonMark()}<div class="eyebrow">受け渡し</div>`, p, nextP, 'nightAdvance()');
  }
  return `
  <div class="panel callwrap">
    ${moonMark()}
    <div class="eyebrow">全員の行動が終わりました</div>
    <div class="who">${san(p)}、夜が明けます</div>
    <div class="msg">${san(p)}:下のボタンを押してから、端末を全員に見える場所に置いてください。</div>
    <button class="btn btn-primary" onclick="nightAdvance()">押して朝を迎える</button>
  </div>`;
}
function pick(field, id){
  if(actLocked()) return;
  if(field === 'hunterTarget' && !state.hunterConsecutive && id === state.lastHunterProtect) return;
  state.night[field] = id;
  render();
}
// 設定で「公開する」にしている退場理由の場合のみ、役職名を返す(それ以外はnull)
function revealedRoleOf(q){
  const on = (q.deathCause==='executed' && state.revealOnExecution) || (q.deathCause==='killed' && state.revealOnAttack);
  return on ? ROLES[q.role].name : null;
}
function roleBadgeHtml(q){
  const r = ROLES[q.role];
  return `<div class="badge ${r.cls}" style="margin-top:8px;">${r.emoji} ${r.name}だった</div>`;
}
function deathStatus(q){
  const base = q.deathCause==='executed' ? '追放' : '死亡';
  const r = revealedRoleOf(q);
  return r ? `${base}(${r})` : base;
}
function targetRow(q, selectedId, onclickJs, disabledReason, note){
  let status = null, disabled = false;
  if(!q.alive){ status = deathStatus(q); disabled = true; }
  else if(disabledReason){ status = disabledReason; disabled = true; }
  const cls = ['pbtn'];
  if(disabled) cls.push(q.alive ? 'locked' : 'dead');
  if(!disabled && selectedId===q.id) cls.push('selected');
  const onclickAttr = disabled ? '' : ` onclick="${onclickJs}"`;
  const tag = status ? `<span class="tag">${status}</span>` : (!disabled && note ? `<span class="tag">${note}</span>` : '');
  return `<div class="${cls.join(' ')}"${onclickAttr}>
    <span>${escapeHtml(q.name)}</span>
    ${tag}
  </div>`;
}
function nightAct(){ state.night.phase = 'act'; startActLock(); render(); }
function nightConfirmAct(){ if(actLocked()) return; state.night.phase = 'result'; render(); }
function nightPass(){ state.night.phase = 'pass'; render(); }
function nightAdvance(){
  const nextIdx = state.night.qIdx+1;
  if(nextIdx < state.night.queue.length){
    state.night.qIdx = nextIdx;
    state.night.phase = 'call';
    state.night.villagerDummy = null; // 村人の選択は演技用なので毎回リセット
    render();
  } else {
    resolveNight();
  }
}
function resolveNight(){
  const wolfTarget = state.night.wolfTarget;
  const hunterTarget = state.night.hunterTarget;
  let victimId = null;
  if(wolfTarget !== null && wolfTarget !== hunterTarget){
    victimId = wolfTarget;
  }
  state.lastVictim = victimId;
  if(victimId !== null){ const v = playerById(victimId); v.alive = false; v.deathCause = 'killed'; }
  state.lastHunterProtect = hunterTarget;
  // 公開情報のみ記録(誰が襲撃を指示したか・誰が守ったかは記録しない)
  if(victimId !== null){
    const v = playerById(victimId);
    const rv = revealedRoleOf(v);
    addLog(`第${state.night.day}日の朝:${v.name}さんが襲撃された${rv ? '(役職:'+rv+')' : ''}`);
  }
  else addLog(`第${state.night.day}日の朝:犠牲者はいなかった`);
  state.screen = 'morning';
  render();
}

/* ---------- MORNING ---------- */
function screenMorning(){
  const v = state.lastVictim !== null ? playerById(state.lastVictim) : null;
  const body = v
    ? `<div class="msg">${escapeHtml(v.name)} さんが、無惨な姿で発見されました。</div>${revealedRoleOf(v) ? roleBadgeHtml(v) : ''}`
    : `<div class="msg">今夜、犠牲者はいませんでした。誰かが守り抜いたようです。</div>`;
  return `
  <div class="panel callwrap">
    ${moonMark()}
    <div class="eyebrow">朝が来た</div>
    <div class="who">第 ${state.night.day} 日の朝</div>
    ${body}
    <button class="btn btn-primary" onclick="afterMorning()">話し合いへ進む</button>
  </div>`;
}
function afterMorning(){
  // 襲撃の結果による勝敗判定
  const r = checkWinAfterAttack();
  if(r){ finishGame(r); return; }
  beginVote();
}

/* ---------- 勝敗判定 ----------
   村人陣営の勝利: 「人狼」が全滅したとき(パパラッチ・狂人が生存していても。襲撃できる人狼がいないため)
   人数の数え方: 人狼側 = 人狼 + パパラッチ / 村人陣営 = それ以外の生存者(狂人は人数の上では村人側に数える)
   ※ 狂人・パパラッチは人狼陣営として勝敗を共にする(人狼陣営が勝てば勝ち)
   ・人狼が全滅 → 村人陣営の勝利
   ・襲撃の結果: 村人陣営の人数が人狼と同数以下 → 人狼陣営の勝利
   ・追放の結果: 村人陣営の人数が人狼より少ない → 人狼陣営の勝利
                 村人陣営の人数が人狼と同数、または人狼より1人多い状態で、狩人が生存していなければ → 人狼陣営の勝利
                 (狩人が生存している場合は、護衛で襲撃を防げる可能性があるため続行) */
function countSides(){
  const wolfSide = aliveWolfSide().length;
  const wolves = alivePlayers().filter(p=>p.role==='wolf').length;   // 襲撃できる「人狼」そのものの人数
  return { wolves, wolfSide, villageSide: alivePlayers().length - wolfSide };
}
function checkWinAfterAttack(){
  const {wolves, wolfSide, villageSide} = countSides();
  if(wolves === 0) return {winner:'villagers', reason:'wolves_eliminated'};
  if(villageSide <= wolfSide) return {winner:'wolves', reason:'attack_parity'};
  return null;
}
function checkWinAfterExecution(){
  const {wolves, wolfSide, villageSide} = countSides();
  if(wolves === 0) return {winner:'villagers', reason:'wolves_eliminated'};
  if(villageSide < wolfSide) return {winner:'wolves', reason:'execution_below'};
  const hunterAlive = state.players.some(p=>p.alive && p.role==='hunter');
  if(!hunterAlive){
    if(villageSide === wolfSide) return {winner:'wolves', reason:'execution_parity'};
    if(villageSide === wolfSide + 1) return {winner:'wolves', reason:'execution_lead'};
  }
  return null;
}
function finishGame(result){
  state.winner = result.winner;
  state.winReason = result.reason;
  addLog('ゲーム終了:' + (result.winner==='villagers' ? '村人陣営の勝利' : '人狼陣営の勝利'));
  state.screen = 'gameover';
  render();
}

/* ---------- DAY VOTE (open, public) ---------- */
function beginVote(){
  // その日の最初の投票(再投票の状態をリセット)
  state.revoteRound = 0;
  state.voteCandidates = null;
  state.voteQueueIds = alivePlayers().map(p=>p.id);
  state.voteIdx = 0;
  state.votes = {};
  state.screen = 'day_vote';
  render();
}
function beginRevote(){
  // 同率1位だけを対象にした再投票(投票するのは生存者全員)
  state.voteQueueIds = alivePlayers().map(p=>p.id);
  state.voteIdx = 0;
  state.votes = {};
  state.screen = 'day_vote';
  render();
}
function screenVote(){
  const voterId = state.voteQueueIds[state.voteIdx];
  const voter = playerById(voterId);
  const cands = state.voteCandidates;
  const targets = state.players.filter(p=>p.id !== voterId);
  const rows = targets.map(p=>{
    const reason = (cands && p.alive && !cands.includes(p.id)) ? '対象外' : null;
    return targetRow(p, state.votes[voterId], `castVote(${voterId}, ${p.id})`, reason);
  }).join('');
  const eyebrow = cands
    ? `再投票(${state.revoteRound}回目)・${state.voteIdx+1} / ${state.voteQueueIds.length}`
    : `話し合い・投票 ${state.voteIdx+1} / ${state.voteQueueIds.length}`;
  const hint = cands
    ? `同率1位の ${cands.map(id=>escapeHtml(playerById(id).name)+'さん').join('・')} の中から選んでください。投票は公開で行います。`
    : '投票は公開で行います。話し合ってから選んでください。';
  return `
  <div class="panel">
    <div class="eyebrow">${eyebrow}</div>
    <h3>${san(voter)}は誰に投票しますか?</h3>
    <p class="hint">${hint}</p>
    <div class="playergrid">${rows}</div>
    <button class="btn btn-primary" ${state.votes[voterId]===undefined?'disabled style="opacity:.4"':''} onclick="voteAdvance()">${san(voter)}の投票を確定</button>
  </div>`;
}
function castVote(voterId, targetId){ state.votes[voterId] = targetId; render(); }
function voteAdvance(){
  if(state.voteIdx+1 < state.voteQueueIds.length){
    state.voteIdx += 1;
    render();
  } else {
    resolveVote();
  }
}
function resolveVote(){
  const tally = {};
  Object.values(state.votes).forEach(t => { tally[t] = (tally[t]||0)+1; });
  let max = -1, leaders = [];
  Object.entries(tally).forEach(([id,c])=>{
    id = Number(id);
    if(c > max){ max = c; leaders = [id]; }
    else if(c === max){ leaders.push(id); }
  });
  state.tieNote = leaders.length > 1;
  const day = state.night.day;

  // 投票結果をログへ(得票数のみ。誰が誰に投票したかは記録しない)
  const tallyText = Object.entries(tally).sort((a,b)=>b[1]-a[1])
    .map(([id,c])=>`${playerById(Number(id)).name} ${c}票`).join(' / ');
  addLog(`第${day}日 ${state.revoteRound>0 ? '再投票('+state.revoteRound+'回目)' : '投票'}結果:${tallyText}`);

  // 社長ルール: 最多得票が社長単独ならそのまま社長が追放される。
  // そうでなければ、票数にかかわらず社長が投票したプレイヤーが追放される(この場合は再投票なし)。
  const president = state.players.find(p=>p.alive && p.role==='president');
  let executedId = null;
  let executionNote = null;
  if(president && !(leaders.length===1 && leaders[0]===president.id)){
    const target = state.votes[president.id];
    executedId = (target !== undefined) ? target : (leaders.length ? leaders[Math.floor(Math.random()*leaders.length)] : null);
    // 社長の投票先が最多得票(同数トップ含む)に入っていなければ「社長指名により追放」
    executionNote = leaders.includes(executedId) ? (leaders.length > 1 ? 'president_tiebreak' : null) : 'president';
  } else if(leaders.length === 1){
    executedId = leaders[0];
    if(state.revoteRound > 0) executionNote = 'revote';
  } else if(leaders.length > 1){
    if(state.revoteRound < MAX_REVOTES){
      // 同率1位が複数 → 同率1位だけを対象に再投票
      state.revoteRound += 1;
      state.voteCandidates = leaders;
      state.revoteInfo = leaders.map(id=>({id, count: tally[id]}));
      addLog(`第${day}日:同数のため再投票(${state.revoteRound}回目)`, '対象:' + leaders.map(id=>playerById(id).name).join('・'));
      state.screen = 'revote_notice';
      render();
      return;
    }
    // 再投票を繰り返しても決まらない場合は、同率1位の中から抽選
    executedId = leaders[Math.floor(Math.random()*leaders.length)];
    executionNote = 'random';
  }

  state.lastExecuted = executedId;
  state.executionNote = executionNote;
  if(executedId !== null){
    const e = playerById(executedId);
    e.alive = false; e.deathCause = 'executed';
    const noteText = executionNote==='president' ? '(社長指名により追放)' : executionNote==='president_tiebreak' ? '(同数票のため社長の投票先で決定)' : executionNote==='revote' ? '(再投票の結果)' : executionNote==='random' ? '(再投票でも同数のため抽選)' : '';
    const re = revealedRoleOf(e);
    addLog(`第${day}日:${e.name}さんが追放された${noteText}${re ? '(役職:'+re+')' : ''}`);
  } else {
    addLog(`第${day}日:追放者なし`);
  }
  state.screen = 'execution';
  render();
}
function screenRevoteNotice(){
  const rows = state.revoteInfo.map(x=>`
    <div class="resultrow"><span class="rname">${escapeHtml(playerById(x.id).name)}さん</span><span class="small">${x.count}票</span></div>`).join('');
  return `
  <div class="panel callwrap">
    <div class="eyebrow">同数票</div>
    <div class="who">再投票を行います(${state.revoteRound}回目)</div>
    <div class="msg">同率1位の中から、追放する人を選び直します。<br>${state.revoteRound >= MAX_REVOTES ? '※ これでも決まらない場合は抽選で決定します。' : ''}</div>
    <div class="resultlist" style="text-align:left;">${rows}</div>
    <button class="btn btn-primary" style="margin-top:20px;" onclick="beginRevote()">再投票を始める</button>
  </div>`;
}

/* ---------- EXECUTION RESULT ---------- */
function screenExecution(){
  const p = state.lastExecuted !== null ? playerById(state.lastExecuted) : null;
  return `
  <div class="panel callwrap">
    <div class="eyebrow">処刑</div>
    ${p ? `
      <div class="who">${escapeHtml(p.name)} さん</div>
      <div class="msg">村の裁きにより、追放されました。${revealedRoleOf(p) ? '' : '正体はまだ明かされません。'}</div>
      ${revealedRoleOf(p) ? roleBadgeHtml(p) : ''}
      ${state.executionNote==='president' ? '<div class="badge president" style="margin-top:10px;">🎩 社長指名により追放</div><div class="hint" style="margin-top:8px;">最多得票ではなく、社長が投票した人が追放されました。</div>'
        : state.executionNote==='president_tiebreak' ? '<div class="hint">※ 同数票のため、社長の投票先で決定しました。</div>'
        : state.executionNote==='revote' ? '<div class="hint">※ 再投票の結果、追放が決定しました。</div>'
        : state.executionNote==='random' ? '<div class="hint">※ 再投票でも同数だったため、抽選で決定しました。</div>' : ''}
    ` : `<div class="who">追放者なし</div><div class="msg">票が入りませんでした。</div>`}
    <button class="btn btn-primary" style="margin-top:24px;" onclick="afterExecution()">続ける</button>
  </div>`;
}
function afterExecution(){
  // 追放の結果による勝敗判定
  const r = checkWinAfterExecution();
  if(r){ finishGame(r); return; }
  state.night.day += 1;
  beginNight();
}

/* ---------- GAME OVER ---------- */
function screenGameOver(){
  const title = state.winner === 'villagers' ? '村人陣営の勝利' : '人狼陣営の勝利';
  const subTexts = {
    wolves_eliminated: '人狼がすべて排除されました。',
    attack_parity: '襲撃の結果、村人陣営の人数が人狼陣営と同数以下になりました。',
    execution_below: '追放の結果、村人陣営の人数が人狼陣営より少なくなりました。',
    execution_parity: '追放の結果、村人陣営の人数が人狼陣営と同数になり、狩人も不在のため、人狼陣営の勝利となります。',
    execution_lead: '追放の結果、村人陣営が人狼陣営より1人多いだけとなり、狩人も不在のため、次の襲撃で人狼陣営の勝利が確定します。'
  };
  const teamNames = ['madman','paparazzi'].filter(r=>state.players.some(p=>p.role===r)).map(r=>ROLES[r].name);
  const madNote = (state.winner==='wolves' && teamNames.length) ? ` ${teamNames.join('・')}も人狼陣営として勝利です。` : '';
  const sub = (subTexts[state.winReason] || '') + madNote;
  const rows = state.players.map(p=>{
    const r = ROLES[p.role];
    return `<div class="resultrow ${p.alive?'':'dead'}">
      <span class="rname">${escapeHtml(p.name)}</span>
      <span class="badge ${r.cls}">${r.emoji} ${r.name}</span>
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <div class="eyebrow center" style="text-align:center;">GAME OVER</div>
    <h1 class="center" style="text-align:center;">${title}</h1>
    <p class="lead center" style="text-align:center;">${sub}</p>
    <div class="divider"></div>
    <h3>全員の役職</h3>
    <div class="resultlist">${rows}</div>
    <button class="btn btn-primary" onclick="resetGame()">最初から遊ぶ</button>
  </div>`;

function freshLottery(){

}
let lotteryState = freshLottery();
function renderLotteryScreen(){
  const s = lotteryState;
  if(s.phase==='setup') return screenLotterySetup();
  if(s.phase==='draw') return screenLotteryDraw();
  return screenLotteryTeams();
}
function screenLotterySetup(){
  const s = lotteryState;
  const chips = s.items.map((it,i)=>`<span class="chip">${escapeHtml(it)} <span class="x" onclick="removeLotteryItem(${i})">✕</span></span>`).join('');
  const maxTeams = Math.max(2, s.items.length || 2);
  return `
  <div class="panel">

    <div class="eyebrow">抽選</div>

    <p class="lead">人の名前でも、お題でも、何でもランダムに扱えます。</p>

    <label>モード</label>
    <div class="row" style="gap:8px; margin-bottom:14px;">
      <button class="btn ${s.mode==='draw'?'btn-primary':''}" style="margin:0;" onclick="setLotteryMode('draw')">1件ずつ抽選</button>
      <button class="btn ${s.mode==='teams'?'btn-primary':''}" style="margin:0;" onclick="setLotteryMode('teams')">チーム分け</button>
    </div>

    <label>候補</label>
    <div class="row">
      <input type="text" value="${escapeHtml(s.inputVal)}" oninput="setLotteryInput(this.value)" onkeydown="if(event.key==='Enter'){addLotteryItem();}" placeholder="候補を入力してEnter" style="flex:1;">
    </div>
    <button class="btn btn-primary" onclick="addLotteryItem()">追加する</button>
    <div class="chipwrap">${chips || '<p class="hint">まだ候補がありません</p>'}</div>

    ${s.mode==='teams' ? `
      <label>チーム数</label>
      <div class="stepper">
        <button onclick="changeTeamCount(-1)">−</button>
        <div class="val">${s.teamCount}</div>
        <button onclick="changeTeamCount(1)">+</button>
      </div>
      <p class="hint">${s.items.length}件を${s.teamCount}チームに振り分けます</p>
      <button class="btn btn-primary" ${s.items.length<2?'disabled style="opacity:.4"':''} onclick="startTeams()">この候補でチーム分けする</button>
    ` : `
      <button class="btn btn-primary" ${s.items.length<1?'disabled style="opacity:.4"':''} onclick="startLottery()">この候補で抽選を始める(${s.items.length}件)</button>
    `}
  </div>`;
}
function setLotteryMode(m){ lotteryState.mode = m; render(); }
function setLotteryInput(v){ lotteryState.inputVal = v; }
function addLotteryItem(){
  const v = lotteryState.inputVal.trim();
  if(!v) return;
  lotteryState.items.push(v);
  lotteryState.inputVal = '';
  render();
}
function removeLotteryItem(i){ lotteryState.items.splice(i,1); render(); }
function changeTeamCount(d){
  const s = lotteryState;
  const maxT = Math.max(2, s.items.length || 2);
  const t = Math.min(maxT, Math.max(2, s.teamCount+d));
  s.teamCount = t;
  render();
}
function startLottery(){
  lotteryState.pool = [...lotteryState.items];
  lotteryState.drawn = [];
  lotteryState.phase = 'draw';
  render();
}
function screenLotteryDraw(){
  const s = lotteryState;
  const remaining = s.pool.length;
  const last = s.drawn[s.drawn.length-1];
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">抽選</div>
    <h1>残り ${remaining} 件</h1>
    ${last ? `
      <div class="card3d"><div class="cardface pop-in">
        <div class="roleicon">🎉</div>
        <div class="rolename">${escapeHtml(last)}</div>
      </div></div>
    ` : `<p class="lead">ボタンを押して抽選してください。</p>`}
    <button class="btn btn-danger" ${remaining===0?'disabled style="opacity:.4"':''} onclick="drawLottery()">${remaining===0?'すべて抽選済み':'抽選する!'}</button>
    ${s.drawn.length ? `
      <div class="divider"></div>
      <h3>抽選順</h3>
      <div class="resultlist">${s.drawn.map((it,i)=>`<div class="resultrow"><span class="rname">${i+1}. ${escapeHtml(it)}</span></div>`).join('')}</div>
    ` : ''}
    <button class="btn btn-primary" onclick="resetLottery()">候補を編集してやり直す</button>
  </div>`;
}
function drawLottery(){
  const s = lotteryState;
  if(s.pool.length===0) return;
  const idx = Math.floor(Math.random()*s.pool.length);
  const [picked] = s.pool.splice(idx,1);
  s.drawn.push(picked);
  render();
}
function startTeams(){
  const s = lotteryState;
  const shuffled = [...s.items];
  shuffle(shuffled);
  const teams = Array.from({length:s.teamCount}, ()=>[]);
  shuffled.forEach((item,i)=> teams[i % s.teamCount].push(item));
  s.teams = teams;
  s.phase = 'teams_result';
  render();
}
function screenLotteryTeams(){
  const s = lotteryState;
  const groups = s.teams.map((team,i)=>`
    <div style="margin-bottom:16px;">
      <h3>チーム ${i+1}</h3>
      <div class="resultlist">${team.map(name=>`<div class="resultrow"><span class="rname">${escapeHtml(name)}</span></div>`).join('')}</div>
    </div>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">チーム分け結果</div>
    <h1>${s.teamCount}チームに分かれました</h1>
    ${groups}
    <button class="btn btn-primary" onclick="startTeams()">もう一度シャッフルする</button>
    <button class="btn btn-sub" onclick="resetLottery()">候補を編集してやり直す</button>
  </div>`;
}
function resetLottery(){ lotteryState.phase='setup'; lotteryState.drawn=[]; render(); }

function freshSurveyChoice(){

function renderSurveyChoiceScreen(){

}
function screenSurveyChoiceSetup(){
  const s = surveyChoiceState;
  const optRows = s.options.map((op,i)=>`
    <div class="nameitem">
      <div class="idx">${i+1}</div>

}
function setSurveyQuestion(v){ surveyChoiceState.question=v; refreshSurveyChoiceStartBtn(); }
function setSurveyOption(i,v){ surveyChoiceState.options[i]=v; refreshSurveyChoiceStartBtn(); }
function refreshSurveyChoiceStartBtn(){
  const el = document.getElementById('surveyChoiceStartBtn');
  if(!el) return;
  const ok = surveyChoiceState.question.trim() && surveyChoiceState.options.filter(o=>o.trim()).length>=2;
  el.disabled = !ok;
  el.style.opacity = ok ? '1' : '.4';
}
function addSurveyOption(){ surveyChoiceState.options.push(''); render(); }
function removeSurveyOption(i){ surveyChoiceState.options.splice(i,1); render(); }
function changeSurveyN(d){
  const s = surveyChoiceState;
  const n = Math.min(30, Math.max(2, s.n+d));
  if(n===s.n) return;
  s.n = n;
  s.names = getNames(n);
  render();
}
function setSurveyName(i,v){ surveyChoiceState.names[i] = v; setSharedName(i, v); }
function startSurveyChoice(){
  const s = surveyChoiceState;
  s.options = s.options.filter(o=>o.trim());
  s.answers = new Array(s.n).fill(null);
  s.qIdx = 0;
  s.subPhase = 'call';
  s.phase = 'collect';
  render();
}
function screenSurveyChoiceCollect(){
  const s = surveyChoiceState;
  const name = s.names[s.qIdx] || ('プレイヤー'+(s.qIdx+1));
  if(s.subPhase==='call'){
    return `
    <div class="panel callwrap">
      <div class="eyebrow">回答 ${s.qIdx+1} / ${s.n}</div>
      <div class="who">${escapeHtml(name)} さんの番です</div>
      <div class="msg">他の人に見えないように、画面を自分だけで確認してください。</div>
      <button class="btn btn-primary" onclick="surveyChoiceAct()">回答する</button>
    </div>`;
  }
  if(s.subPhase==='act'){
    const rows = s.options.map((op,i)=>`<div class="pbtn ${s.answers[s.qIdx]===i?'selected':''}" onclick="pickSurveyAnswer(${i})"><span>${escapeHtml(op)}</span></div>`).join('');
    return `
    <div class="panel">
      <div class="eyebrow">${escapeHtml(s.question)}</div>
      <h3>回答を選んでください</h3>
      <div class="playergrid">${rows}</div>
      <button class="btn btn-primary" ${s.answers[s.qIdx]===null?'disabled style="opacity:.4"':''} onclick="surveyChoiceConfirm()">この回答にする</button>
    </div>`;
  }
  const hasNext = s.qIdx+1 < s.n;
  const nextName = hasNext ? escapeHtml(s.names[s.qIdx+1]||('プレイヤー'+(s.qIdx+2))) : null;
  return `
  <div class="panel callwrap">
    <div class="eyebrow">受け渡し</div>
    <div class="who">画面を伏せてください</div>
    <div class="msg">${hasNext ? '次は '+nextName+' さんに渡してください。' : '全員の回答が終わりました。'}</div>
    <button class="btn btn-primary" onclick="surveyChoiceAdvance()">${hasNext?'渡したら次へ':'結果を見る'}</button>
  </div>`;
}
function surveyChoiceAct(){ surveyChoiceState.subPhase='act'; render(); }
function pickSurveyAnswer(i){ surveyChoiceState.answers[surveyChoiceState.qIdx]=i; render(); }
function surveyChoiceConfirm(){ surveyChoiceState.subPhase='pass'; render(); }
function surveyChoiceAdvance(){
  const s = surveyChoiceState;
  if(s.qIdx+1 < s.n){ s.qIdx+=1; s.subPhase='call'; render(); }
  else { s.phase='results'; render(); }
}
function screenSurveyChoiceResults(){
  const s = surveyChoiceState;
  const total = s.answers.filter(a=>a!==null).length;
  const tally = s.options.map((op,i)=> s.answers.filter(a=>a===i).length);
  const maxCount = Math.max(...tally, 1);
  const rows = s.options.map((op,i)=>{
    const c = tally[i];
    const pct = Math.round((c/maxCount)*100);
    return `
    <div class="barrow">
      <div class="row" style="justify-content:space-between; margin-bottom:6px;">
        <span>${escapeHtml(op)}</span><span class="small">${c}票</span>
      </div>
      <div class="bartrack"><div class="barfill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">結果(匿名)</div>
    <h1>${escapeHtml(s.question)}</h1>
    <p class="lead">回答数: ${total}件</p>
    ${rows}
    <button class="btn btn-primary" onclick="enterSurveyChoice()">もう一度アンケートする</button>
  </div>`;
}

    </div>`;
  }
  if(s.subPhase==='act'){
    return `

      <div class="eyebrow">${escapeHtml(s.question)}</div>
      <h3>${escapeHtml(name)} さんの回答</h3>

      <button class="btn btn-primary" id="surveyFreeConfirmBtn" ${s.inputVal.trim()?'':'disabled style="opacity:.4"'} onclick="surveyFreeConfirm()">この内容で回答する</button>
    </div>`;
  }
  const hasNext = s.qIdx+1 < s.n;
  const nextName = hasNext ? escapeHtml(s.names[s.qIdx+1]||('プレイヤー'+(s.qIdx+2))) : null;
  return `

    <div class="eyebrow">受け渡し</div>

function setSurveyFreeInput(v){ surveyFreeState.inputVal=v; refreshSurveyFreeConfirmBtn(); }

  const el = document.getElementById('surveyFreeConfirmBtn');

function surveyFreeConfirm(){

function surveyFreeAdvance(){
  const s = surveyFreeState;

function screenSurveyFreeResults(){

}

function setInsiderGenre(k){ insiderState.genre = k; render(); }
/* マスターの決め方: ランダム(従来どおり) / 順番(前回のマスターの次の人) / プレイヤー指定 */
function insiderDisplayNames(s){ return s.names.map((nm,i)=> nm.trim() || ('プレイヤー'+(i+1))); }
function insiderNextMasterIdx(names){
  const li = insiderLastMasterName !== null ? names.indexOf(insiderLastMasterName) : -1;
  return li === -1 ? 0 : (li + 1) % names.length;
}
function insiderOrderHintText(names){
  return `前回のマスターの次の人がマスターになります(最初は1人目)。次のマスター:${names[insiderNextMasterIdx(names)]}さん`;
}
function setInsiderMasterMode(k){
  const s = insiderState;
  s.masterMode = k;
  s.masterPick = Math.min(Math.max(0, s.masterPick), s.n - 1);
  render();
}
function setInsiderMasterPick(v){ insiderState.masterPick = Number(v); }
function refreshInsiderMasterUi(){
  // 名前の入力中に、プレイヤー指定の選択肢と「次のマスター」の表示を更新する(入力欄の再描画はしない)
  const names = insiderDisplayNames(insiderState);

  if(sel){ [...sel.options].forEach((o,i)=>{ if(names[i] !== undefined) o.textContent = names[i]; }); }

}
function setInsiderMinutes(m){ insiderState.minutes = m; render(); }
function setInsiderName(i,v){ insiderState.names[i] = v; setSharedName(i, v); refreshInsiderMasterUi(); }
function changeInsiderN(d){
  const s = insiderState;
  const n = Math.min(20, Math.max(3, s.n + d));
  if(n === s.n) return;
  s.n = n;
  s.names = getNames(n);
  s.masterPick = Math.min(s.masterPick, n - 1);
  render();
}
function pickInsiderWord(genreKey){
  const pool = genreKey === 'all'
    ? Object.entries(INSIDER_GENRES).filter(([k,g])=>k!=='all' && !g.excludeFromAll).flatMap(([k,g])=>g.words.map(w=>({w, label:g.label})))
    : INSIDER_GENRES[genreKey].words.map(w=>({w, label:INSIDER_GENRES[genreKey].label}));
  let cands = pool.filter(x=>!insiderUsedWords.has(x.w));
  if(cands.length === 0){ pool.forEach(x=>insiderUsedWords.delete(x.w)); cands = pool; }
  const pick = cands[Math.floor(Math.random()*cands.length)];
  insiderUsedWords.add(pick.w);
  return pick;
}
function startInsider(){
  const s = insiderState;
  const players = s.names.map((nm,i)=>({id:i, name: nm.trim() || ('プレイヤー'+(i+1)), role:'citizen'}));
  const names = players.map(p=>p.name);
  // マスターの決め方: ランダム(マスターは2連続不可) / 順番 / プレイヤー指定。
  // 順番・指定のときはマスターを固定し、インサイダーだけをランダムに決める(インサイダーは3連続不可)。
  let fixedMaster = null;
  if(s.masterMode === 'order') fixedMaster = insiderNextMasterIdx(names);
  else if(s.masterMode === 'pick') fixedMaster = Math.min(Math.max(0, s.masterPick), players.length - 1);
  const roles = drawRolesWithRunLimit(()=>{
    const r = new Array(players.length).fill('citizen');
    if(fixedMaster === null){
      const order = players.map((_,i)=>i);
      shuffle(order);
      r[order[0]] = 'master';
      r[order[1]] = 'insider';
    } else {
      r[fixedMaster] = 'master';
      const others = players.map((_,i)=>i).filter(i=>i !== fixedMaster);
      shuffle(others);
      r[others[0]] = 'insider';
    }
    return r;
  }, insiderRoleHistory, names, fixedMaster === null ? INSIDER_MAX_RUN : {insider:2});
  players.forEach((p,i)=>{ p.role = roles[i]; });
  recordRoles(insiderRoleHistory, names, roles);
  insiderLastMasterName = names[roles.indexOf('master')];
  const pick = pickInsiderWord(s.genre);
  s.players = players;
  s.word = pick.w;
  s.wordGenreLabel = pick.label;
  s.idx = 0;
  s.subPhase = 'call';
  s.extensions = 0;
  s.revealRoles = false;
  s.phase = 'confirm';
  render();
}

/* ---- role confirmation (1人ずつ端末を回す) ---- */

/* 役職確認画面は表示から3秒間ボタンを押せない(お題を読む時間を確保し、すぐ飛ばされるのを防ぐ) */
const INSIDER_REVEAL_LOCK_MS = 3000;
let insiderLockTimer = null;
function insiderRevealLocked(){
  const s = insiderState;
  return appMode === 'insider' && s.phase === 'confirm' && s.subPhase === 'reveal' && Date.now() < (s.lockUntil || 0);
}
function insiderReveal(){
  const s = insiderState;
  s.subPhase = 'reveal';
  s.lockUntil = Date.now() + INSIDER_REVEAL_LOCK_MS;
  if(insiderLockTimer) clearInterval(insiderLockTimer);
  insiderLockTimer = setInterval(tickInsiderLock, 200);
  render();
}
function tickInsiderLock(){
  const s = insiderState;
  if(!(appMode === 'insider' && s.phase === 'confirm' && s.subPhase === 'reveal')){ clearInterval(insiderLockTimer); insiderLockTimer = null; return; }
  const remain = (s.lockUntil || 0) - Date.now();
  const hint = document.getElementById('insLockHint');
  if(remain > 0){ if(hint) hint.textContent = `あと${Math.ceil(remain/1000)}秒でボタンを押せます`; return; }
  clearInterval(insiderLockTimer); insiderLockTimer = null;
  if(hint) hint.remove();
  const btn = document.getElementById('insDoneBtn');
  if(btn){ btn.disabled = false; btn.style.opacity = '1'; }
}
function insiderDone(){
  if(insiderRevealLocked()) return;
  const s = insiderState;
  if(s.idx === s.players.length - 1){
    insiderPrepareAudio();   // ボタン操作の中で音声を有効化(タイムアップ音用)
    startInsiderCountdown(s.minutes * 60000);
  } else {
    s.subPhase = 'pass';
    render();
  }
}
function insiderAdvance(){
  const s = insiderState;
  s.idx += 1;
  s.subPhase = 'call';
  render();
}

/* ---- countdown ---- */
function fmtTime(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(t/60), sec = t % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function startInsiderCountdown(ms){
  const s = insiderState;
  s.segmentMs = ms;
  s.endAt = Date.now() + ms;
  s.phase = 'countdown';
  if(insiderTimer) clearInterval(insiderTimer);
  insiderTimer = setInterval(tickInsider, 200);
  render();
}
function tickInsider(){
  const s = insiderState;
  if(!(appMode === 'insider' && s.phase === 'countdown')){ clearInterval(insiderTimer); insiderTimer = null; return; }
  const remain = s.endAt - Date.now();
  const el = document.getElementById('insTimer');
  const bar = document.getElementById('insBar');
  if(el) el.textContent = fmtTime(remain);
  if(bar) bar.style.width = Math.max(0, Math.min(100, remain / s.segmentMs * 100)) + '%';
  if(remain <= 0){
    clearInterval(insiderTimer); insiderTimer = null;
    s.phase = 'timeup';
    insiderBeep();
    render();
  }
}
function screenInsiderCountdown(){
  const s = insiderState;
  const remain = s.endAt - Date.now();
  return `
  <div class="panel callwrap">
    <div class="eyebrow">カウントダウン${s.extensions>0 ? '(延長'+s.extensions+'回目)' : ''}</div>
    <div id="insTimer" style="font-family:var(--font-display); font-size:76px; letter-spacing:0.04em; margin:6px 0 14px;">${fmtTime(remain)}</div>
    <div class="barrow" style="margin:0 6px 20px;"><div class="bartrack"><div id="insBar" class="barfill" style="width:${Math.max(0, Math.min(100, remain / s.segmentMs * 100))}%;"></div></div></div>

}

/* ---- sound ---- */
function insiderPrepareAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!insiderAudioCtx) insiderAudioCtx = new AC();
    if(insiderAudioCtx.state === 'suspended') insiderAudioCtx.resume();
  }catch(e){}
}
function insiderBeep(){
  try{
    if(insiderAudioCtx){
      for(let i=0;i<3;i++){
        const o = insiderAudioCtx.createOscillator();
        const g = insiderAudioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.25;
        o.connect(g); g.connect(insiderAudioCtx.destination);
        const t = insiderAudioCtx.currentTime + i*0.4;
        o.start(t); o.stop(t + 0.2);
      }
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

let WW_EXTEND_MS = 60000;

function wwMaxWolves(n){ return Math.max(1, Math.floor((n - 1) / 2)); }  // ウルフは市民より少なくする

/* ---- setup ---- */
function screenWwSetup(){
  const s = wwState;
  const genreChips = Object.entries(WW_GENRES).map(([k,g])=>`<span class="chip pick ${s.genre===k?'sel':''}" onclick="setWwGenre('${k}')">${g.label}</span>`).join('');

function setWwGenre(k){ wwState.genre = k; render(); }
function setWwName(i,v){ wwState.names[i] = v; setSharedName(i, v); }
function changeWwN(d){
  const s = wwState;
  const n = Math.min(20, Math.max(3, s.n + d));
  if(n === s.n) return;
  s.n = n;
  s.names = getNames(n);
  s.wolves = Math.min(s.wolves, wwMaxWolves(n));
  render();
}
function changeWwWolves(d){
  const s = wwState;
  s.wolves = Math.min(wwMaxWolves(s.n), Math.max(1, s.wolves + d));
  render();
}
function changeWwMinutes(d){
  const s = wwState;
  s.minutes = Math.min(30, Math.max(1, s.minutes + d));
  render();
}
function pickWwPair(genreKey){
  const pool = genreKey === 'all'
    ? Object.entries(WW_GENRES).filter(([k,g])=>k!=='all' && !g.excludeFromAll).flatMap(([k,g])=>g.pairs.map(pr=>({pr, label:g.label})))
    : WW_GENRES[genreKey].pairs.map(pr=>({pr, label:WW_GENRES[genreKey].label}));
  const key = x => x.pr.join('/');
  let cands = pool.filter(x=>!wwUsedPairs.has(key(x)));
  if(cands.length === 0){ pool.forEach(x=>wwUsedPairs.delete(key(x))); cands = pool; }
  const pick = cands[Math.floor(Math.random()*cands.length)];
  wwUsedPairs.add(key(pick));
  // どちらを市民のお題にするかもランダム
  const swap = Math.random() < 0.5;
  return { citizen: swap ? pick.pr[1] : pick.pr[0], wolf: swap ? pick.pr[0] : pick.pr[1], label: pick.label };
}
function startWw(){
  const s = wwState;
  const players = s.names.map((nm,i)=>({id:i, name: nm.trim() || ('プレイヤー'+(i+1)), wolf:false}));
  // ウルフは同じ人が3連続にならないようにする
  const names = players.map(p=>p.name);
  const roles = drawRolesWithRunLimit(()=>{
    const order = players.map((_,i)=>i);
    shuffle(order);
    const r = new Array(players.length).fill('citizen');
    for(let k=0;k<s.wolves;k++) r[order[k]] = 'wolf';
    return r;
  }, wwRoleHistory, names, WW_MAX_RUN);
  players.forEach((p,i)=>{ p.wolf = roles[i] === 'wolf'; });
  recordRoles(wwRoleHistory, names, roles);
  const pair = pickWwPair(s.genre);
  s.players = players;
  s.citizenWord = pair.citizen;
  s.wolfWord = pair.wolf;
  s.genreLabel = pair.label;
  s.idx = 0;
  s.subPhase = 'call';
  s.extensions = 0;
  s.resultStep = 1;
  s.phase = 'confirm';
  render();
}

/* ---- お題の確認(1人ずつ端末を回す。自分がウルフかどうかは表示しない) ---- */
function screenWwConfirm(){
  const s = wwState;
  const p = s.players[s.idx];
  const isLast = s.idx === s.players.length - 1;
  const eyebrow = `<div class="eyebrow">お題の確認 ${s.idx+1} / ${s.players.length}</div>`;
  if(s.subPhase === 'call'){
    return callScreen(eyebrow, p, 'wwReveal()', 'お題を確認する');
  }
  if(s.subPhase === 'reveal'){
    const word = p.wolf ? s.wolfWord : s.citizenWord;
    return `
    <div class="panel">
      <div class="eyebrow">${san(p)}のお題</div>
      <div class="card3d">
        <div class="cardface">
          <div class="small">あなたのお題</div>
          <div class="rolename" style="font-size:36px; margin:10px 0;">${escapeHtml(word)}</div>
          <div class="roledesc">他の人のお題と少し違うかもしれません。会話の中で探りましょう。</div>
        </div>
      </div>
      ${isLast ? `<p class="hint">このボタンを押すとカウントダウンが始まります。端末は全員に見える場所に置いてください。</p>` : ''}
      <button class="btn btn-primary" onclick="wwDone()">${san(p)}:確認した${isLast ? '(カウントダウン開始)' : ''}</button>
    </div>`;
  }
  const next = s.players[s.idx + 1];
  return passScreen('<div class="eyebrow">受け渡し</div>', p, next, 'wwAdvance()');
}
function wwReveal(){ wwState.subPhase = 'reveal'; render(); }
function wwDone(){
  const s = wwState;
  if(s.idx === s.players.length - 1){
    insiderPrepareAudio();
    startWwCountdown(s.minutes * 60000);
  } else {
    s.subPhase = 'pass';
    render();
  }
}
function wwAdvance(){
  const s = wwState;
  s.idx += 1;
  s.subPhase = 'call';
  render();
}

/* ---- countdown ---- */
function startWwCountdown(ms){
  const s = wwState;
  s.segmentMs = ms;
  s.endAt = Date.now() + ms;
  s.phase = 'countdown';
  s.confirmEnd = false;
  if(wwTimer) clearInterval(wwTimer);
  wwTimer = setInterval(tickWw, 200);
  render();
}
function tickWw(){
  const s = wwState;
  if(!(appMode === 'wordwolf' && s.phase === 'countdown')){ clearInterval(wwTimer); wwTimer = null; return; }
  const remain = s.endAt - Date.now();
  const el = document.getElementById('wwTimer');
  const bar = document.getElementById('wwBar');
  if(el) el.textContent = fmtTime(remain);
  if(bar) bar.style.width = Math.max(0, Math.min(100, remain / s.segmentMs * 100)) + '%';
  if(remain <= 0){
    clearInterval(wwTimer); wwTimer = null;
    s.phase = 'timeup';
    insiderBeep();
    render();
  }
}
function screenWwCountdown(){
  const s = wwState;
  const remain = s.endAt - Date.now();
  return `
  <div class="panel callwrap">
    <div class="eyebrow">カウントダウン${s.extensions>0 ? '(延長'+s.extensions+'回目)' : ''}</div>
    <div id="wwTimer" style="font-family:var(--font-display); font-size:76px; letter-spacing:0.04em; margin:6px 0 14px;">${fmtTime(remain)}</div>
    <div class="barrow" style="margin:0 6px 20px;"><div class="bartrack"><div id="wwBar" class="barfill" style="width:${Math.max(0, Math.min(100, remain / s.segmentMs * 100))}%;"></div></div></div>

      <div class="hint" style="margin-bottom:6px;">時間前に終了して、ウルフを表示します。よろしいですか?</div>

    `}
  </div>`;
}
function wwAskEnd(){ wwState.confirmEnd = true; render(); }
function wwCancelEnd(){ wwState.confirmEnd = false; render(); }
function screenWwTimeup(){

function setItoName(i,v){ itoState.names[i] = v; setSharedName(i, v); }

function pickItoTopic(){

function startIto(){
  const s = itoState;
  if(s.topicChoice === 'free' && !s.freeTopic.trim()) return;
  // 1〜100から重複なしでランダムに配る(同じ数字は出ない)
  const nums = Array.from({length:100}, (_,i)=>i+1);
  shuffle(nums);
  s.players = s.names.map((nm,i)=>({id:i, name: nm.trim() || ('プレイヤー'+(i+1))}));
  s.numbers = {};
  s.players.forEach((p,i)=>{ s.numbers[p.id] = nums[i]; });
  s.topic = s.topicChoice === 'random' ? pickItoTopic()
          : s.topicChoice === 'free' ? s.freeTopic.trim()
          : ITO_TOPICS[Number(s.topicChoice)];
  s.order = s.players.map(p=>p.id);
  s.idx = 0; s.subPhase = 'call'; s.confirmEnd = false; s.peekId = null; s.peekStep = 'pick';
  s.phase = 'confirm';
  render();
}

/* ---- 数字の確認(1人ずつ端末を回す) ---- */
function screenItoConfirm(){
  const s = itoState;
  const p = s.players[s.idx];
  const isLast = s.idx === s.players.length - 1;
  const eyebrow = `<div class="eyebrow">数字の確認 ${s.idx+1} / ${s.players.length}</div>`;
  if(s.subPhase === 'call'){
    return callScreen(eyebrow, p, 'itoReveal()', '数字を確認する');
  }
  if(s.subPhase === 'reveal'){
    return `
    <div class="panel">
      <div class="eyebrow">${san(p)}の数字</div>
      <div class="card3d">
        <div class="cardface">
          <div class="small">お題:${escapeHtml(s.topic)}</div>
          <div class="rolename" style="font-size:72px; margin:10px 0;">${s.numbers[p.id]}</div>
          <div class="roledesc">数字が大きいほど、お題に強く当てはまります。数字は誰にも見せないでください。</div>
        </div>
      </div>
      ${isLast ? `<p class="hint">このボタンを押すと並べ替え画面に進みます。端末は全員に見える場所に置いてください。</p>` : ''}
      <button class="btn btn-primary" onclick="itoDone()">${san(p)}:確認した${isLast ? '(並べ替えへ)' : ''}</button>
    </div>`;
  }
  const next = s.players[s.idx + 1];
  return passScreen('<div class="eyebrow">受け渡し</div>', p, next, 'itoAdvance()');
}
function itoReveal(){ itoState.subPhase = 'reveal'; render(); }
function itoDone(){
  const s = itoState;
  if(s.idx === s.players.length - 1){
    s.phase = 'arrange';
    render();
  } else {
    s.subPhase = 'pass';
    render();
  }
}
function itoAdvance(){ const s = itoState; s.idx += 1; s.subPhase = 'call'; render(); }

/* ---- 並べ替え(数字は表示しない) ---- */
function screenItoArrange(){
  const s = itoState;
  const rows = s.order.map((id,i)=>{
    const p = s.players[id];
    return `
    <div class="itorow">
      <span class="itorank">${i+1}</span>
      <span class="rname" style="flex:1;">${escapeHtml(p.name)}</span>
      <button class="itobtn" ${i===0?'disabled':''} onclick="moveIto(${i},-1)">↑</button>
      <button class="itobtn" ${i===s.order.length-1?'disabled':''} onclick="moveIto(${i},1)">↓</button>
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <div class="eyebrow">並べ替え</div>
    <div class="small">お題</div>
    <h1 style="margin-top:2px;">${escapeHtml(s.topic)}</h1>
    <p class="hint">お題に沿った言葉で自分の数字の大きさを伝え合い、数字が<strong>大きい順</strong>になるように、上から並べてください。</p>
    <div class="small" style="text-align:center; margin-top:14px;">▲ 数字が大きい</div>
    <div class="itolist">${rows}</div>
    <div class="small" style="text-align:center; margin-bottom:10px;">▼ 数字が小さい</div>
    <button class="btn" onclick="itoPeekOpen()">自分の数字をもう一度確認する</button>
    ${s.confirmEnd ? `
      <div class="hint" style="margin-top:14px;">この並びで結果を確認します。よろしいですか?</div>
      <button class="btn btn-danger" onclick="itoShowResult()">結果を確認する</button>
      <button class="btn btn-sub" onclick="itoCancelEnd()">並べ替えに戻る</button>
    ` : `
      <button class="btn btn-primary" onclick="itoAskEnd()">結果を確認する</button>
    `}
  </div>`;
}
function moveIto(i, d){
  const s = itoState;
  const j = i + d;
  if(j < 0 || j >= s.order.length) return;
  [s.order[i], s.order[j]] = [s.order[j], s.order[i]];
  s.confirmEnd = false;
  keepScroll(()=>render());
}
function itoAskEnd(){ itoState.confirmEnd = true; keepScroll(()=>render()); }
function itoCancelEnd(){ itoState.confirmEnd = false; keepScroll(()=>render()); }

/* ---- 数字の再確認(プレイヤーを選ぶ → 本人が確認 → 並べ替えに戻る) ---- */
function itoPeekOpen(){ const s = itoState; s.phase = 'peek'; s.peekStep = 'pick'; s.peekId = null; s.confirmEnd = false; render(); }
function itoPeekBack(){ const s = itoState; s.phase = 'arrange'; s.peekId = null; render(); }
function itoPeekSelect(id){ const s = itoState; s.peekId = id; s.peekStep = 'call'; render(); }
function itoPeekReveal(){ itoState.peekStep = 'reveal'; render(); }
function itoPeekRepick(){ const s = itoState; s.peekId = null; s.peekStep = 'pick'; render(); }
function screenItoPeek(){
  const s = itoState;
  if(s.peekStep === 'pick'){
    const rows = s.players.map(p=>`<div class="pbtn" onclick="itoPeekSelect(${p.id})"><span>${escapeHtml(p.name)}</span></div>`).join('');
    return `
    <div class="panel">
      <div class="eyebrow">数字の確認</div>
      <h3>数字を確認する人を選んでください</h3>
      <p class="hint">選んだ人に端末を渡し、本人だけが数字を見ます。確認したあとは並べ替え画面に戻ります。</p>
      <div class="playergrid">${rows}</div>
      <button class="btn btn-sub" onclick="itoPeekBack()">やめて並べ替えに戻る</button>
    </div>`;
  }
  const p = s.players[s.peekId];
  if(s.peekStep === 'call'){
    return `
    <div class="panel callwrap">
      <div class="eyebrow">数字の確認</div>
      <div class="who">${san(p)}の番です</div>
      <div class="msg">${san(p)}:端末を受け取ったら、周りの人に画面が見えないようにしてから、${san(p)}自身がボタンを押してください。</div>
      <button class="btn btn-primary" onclick="itoPeekReveal()">数字を確認する</button>
      <button class="btn btn-sub" onclick="itoPeekRepick()">人を選び直す</button>
    </div>`;
  }
  return `
  <div class="panel">
    <div class="eyebrow">${san(p)}の数字</div>
    <div class="card3d">
      <div class="cardface">
        <div class="small">お題:${escapeHtml(s.topic)}</div>
        <div class="rolename" style="font-size:72px; margin:10px 0;">${s.numbers[p.id]}</div>
        <div class="roledesc">数字は誰にも見せないでください。</div>
      </div>
    </div>
    <p class="hint">このボタンを押すと並べ替え画面に戻ります。端末は全員に見える場所に置いてください。</p>
    <button class="btn btn-primary" onclick="itoPeekBack()">${san(p)}:確認した(並べ替えに戻る)</button>
  </div>`;
}

/* ---- 結果 ---- */
function itoShowResult(){ itoState.phase = 'result'; render(); }
function screenItoResult(){
  const s = itoState;
  const nums = s.order.map(id=>s.numbers[id]);
  // 大きい順(厳密に減少)なら成功。前の人より大きい数字が来た行を「違う」として示す
  const bad = s.order.map((id,i)=> i>0 && s.numbers[id] > s.numbers[s.order[i-1]]);
  const ok = !bad.some(Boolean) && nums.every((v,i)=> i===0 || nums[i-1] > v);
  const rows = s.order.map((id,i)=>`
    <div class="resultrow ${bad[i] ? 'bad' : (ok ? 'good' : '')}">
      <span><span class="itorank">${i+1}</span> <span class="rname">${escapeHtml(s.players[id].name)}</span></span>
      <span class="itonum">${s.numbers[id]}</span>
    </div>`).join('');
  const correct = [...s.order].sort((a,b)=>s.numbers[b]-s.numbers[a]);
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow center" style="text-align:center;">結果(お題:${escapeHtml(s.topic)})</div>
    <h1 class="center" style="text-align:center; font-size:40px; color:${ok?'var(--emerald)':'#ffb3a4'};">${ok ? '🎉 成功!' : '💥 失敗…'}</h1>
    <p class="lead center" style="text-align:center;">${ok ? '数字の大きい順に並べられました。' : '数字の大きい順になっていません。'}</p>
    <div class="small" style="text-align:center;">▲ 並べた順(上が大きい)</div>
    <div class="resultlist">${rows}</div>
    ${ok ? '' : `
      <div class="divider"></div>
      <h3>正しい順番</h3>
      <div class="resultlist">${correct.map((id,i)=>`
        <div class="resultrow"><span><span class="itorank">${i+1}</span> <span class="rname">${escapeHtml(s.players[id].name)}</span></span><span class="itonum">${s.numbers[id]}</span></div>`).join('')}</div>
    `}
    <button class="btn btn-primary" onclick="startIto()">もう一度遊ぶ(同じ設定)</button>
    <button class="btn btn-sub" onclick="itoBackToSetup()">設定に戻る</button>
  </div>`;
}
function itoBackToSetup(){ itoState.phase = 'setup'; render(); }
