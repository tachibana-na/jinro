<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人狼 GM代行</title>
<style>
:root{
  --bg-deep:#0a0f1c;
  --bg-panel:#131b2e;
  --bg-panel-light:#1b2440;
  --bg-panel-lighter:#232f52;
  --silver:#cdd6e5;
  --silver-dim:#8894ad;
  --blood:#b3311f;
  --blood-bright:#d64430;
  --amber:#d9a441;
  --mist:#6f93c9;
  --emerald:#6fcf97;
  --line:rgba(205,214,229,0.12);
  --font-display:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(111,147,201,0.10), transparent 60%),
    radial-gradient(ellipse 700px 400px at 90% 100%, rgba(179,49,31,0.08), transparent 60%),
    var(--bg-deep);
  color:var(--silver);
  font-family:var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
#app{width:100%; max-width:520px;}
.panel{
  background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-light));
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  position:relative;
  overflow:hidden;
}
.eyebrow{
  font-size:12px;
  letter-spacing:0.3em;
  color:var(--silver-dim);
  margin:0 0 8px;
  text-transform:uppercase;
}
h1,h2,h3{
  font-family:var(--font-display);
  font-weight:600;
  margin:0 0 6px;
  letter-spacing:0.02em;
}
h1{font-size:26px; color:var(--silver);}
h2{font-size:22px;}
h3{font-size:17px; color:var(--amber);}
p.lead{color:var(--silver-dim); font-size:14px; line-height:1.7; margin:0 0 20px;}
.moon{
  width:34px;height:34px;border-radius:50%;
  position:absolute; top:22px; right:22px;
  box-shadow: inset -8px -3px 0 0 var(--bg-panel), 0 0 18px rgba(217,164,65,0.35);
  background:var(--amber);
}
.daymark{
  position:absolute; top:26px; right:66px;
  font-family:var(--font-display); font-size:12px; letter-spacing:0.15em; color:var(--silver-dim);
}
.row{display:flex; align-items:center; gap:10px;}
.stepper{
  display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0 22px;
}
.stepper button{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel-lighter); color:var(--silver);
  font-size:20px; cursor:pointer;
}
.stepper .val{font-family:var(--font-display); font-size:28px; min-width:54px; text-align:center;}
label{display:block; font-size:12px; color:var(--silver-dim); letter-spacing:0.08em; margin:18px 0 8px;}
input[type=text]{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px; font-family:var(--font-body);
}
input[type=text]:focus{outline:1px solid var(--mist);}
.namegrid{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; padding-right:2px; margin-bottom:6px;}
.nameitem{display:flex; align-items:center; gap:10px;}
.nameitem .idx{width:24px; text-align:right; font-size:12px; color:var(--silver-dim); font-family:var(--font-display);}
.btn{
  display:block; width:100%; text-align:center;
  padding:16px 18px; border-radius:14px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver);
  font-family:var(--font-body); font-size:16px; font-weight:600; letter-spacing:0.02em;
  cursor:pointer; margin-top:10px; transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(180deg, var(--mist), #4c6ea3); border-color:transparent; color:#0a0f1c;}
.btn-danger{background:linear-gradient(180deg, var(--blood-bright), var(--blood)); border-color:transparent; color:#fff;}
.btn-ghost{background:transparent;}
.btn-sub{font-size:12px; padding:10px; color:var(--silver-dim);}
.hint{font-size:12px; color:var(--silver-dim); margin-top:4px; line-height:1.6;}

.callwrap{text-align:center; padding:40px 10px;}
.callwrap .who{font-family:var(--font-display); font-size:30px; margin:10px 0 4px; color:var(--silver);}
.callwrap .msg{color:var(--silver-dim); font-size:14px; margin-bottom:26px; line-height:1.7;}

.card3d{perspective:1200px; margin:10px 0 20px;}
.cardface{
  min-height:180px; border-radius:16px; padding:26px 22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  border:1px solid var(--line);
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 60%), var(--bg-panel-lighter);
}
.cardface .rolename{font-family:var(--font-display); font-size:30px; margin:6px 0; letter-spacing:0.06em;}
.cardface .roledesc{font-size:13px; color:var(--silver-dim); line-height:1.8; margin-top:8px;}
.roleicon{font-size:40px; line-height:1;}

.playergrid{display:flex; flex-direction:column; gap:8px; margin:14px 0 6px;}
.pbtn{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px;
  cursor:pointer;
}
.pbtn.selected{border-color:var(--amber); background:rgba(217,164,65,0.14);}
.pbtn.dead{opacity:0.35; text-decoration:line-through; pointer-events:none; cursor:default;}
.pbtn.locked{opacity:0.4; pointer-events:none; cursor:default;}
.pbtn .tag{font-size:11px; color:var(--silver-dim);}

.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; letter-spacing:0.08em; border:1px solid var(--line); color:var(--silver-dim);}
.badge.wolf{color:#ffb3a4; border-color:rgba(214,68,48,0.5); background:rgba(214,68,48,0.1);}
.badge.villager{color:var(--amber); border-color:rgba(217,164,65,0.4); background:rgba(217,164,65,0.08);}
.badge.seer{color:var(--mist); border-color:rgba(111,147,201,0.4); background:rgba(111,147,201,0.08);}
.badge.hunter{color:var(--silver); border-color:var(--line); background:rgba(205,214,229,0.06);}
.badge.president{color:var(--emerald); border-color:rgba(111,207,151,0.45); background:rgba(111,207,151,0.09);}
.badge.madman{color:#c9a8ff; border-color:rgba(169,139,217,0.5); background:rgba(169,139,217,0.1);}
.badge.paparazzi{color:#ffb3a4; border-color:rgba(214,68,48,0.5); background:rgba(214,68,48,0.1);}
.lockedgrid{opacity:.45; pointer-events:none;}
.lockhint{color:var(--amber);}

.chipwrap{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--bg-panel-lighter); border:1px solid var(--line); font-size:13px;}
.chip .x{cursor:pointer; color:var(--silver-dim);}
.chip.pick{cursor:pointer; padding:9px 16px; font-size:14px;}
.chip.sel{border-color:var(--amber); background:rgba(217,164,65,0.16); color:var(--silver);}
.backlink{display:inline-block; background:none; border:none; color:var(--silver-dim); font-size:12px; cursor:pointer; margin-bottom:16px; padding:0; font-family:var(--font-body);}
.menubtn{text-align:left;}
.menubtn .sub{display:block; font-size:12px; font-weight:400; color:rgba(255,255,255,0.75); margin-top:2px;}
.barrow{margin-bottom:14px;}
.barrow .bartrack{height:10px; border-radius:6px; background:var(--bg-panel-lighter); overflow:hidden;}
.barrow .barfill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--mist), #4c6ea3);}
textarea{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-panel-lighter); color:var(--silver); font-size:15px; font-family:var(--font-body); resize:vertical;
}
textarea:focus{outline:1px solid var(--mist);}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.pop-in{animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;}
.logpanel{
  margin-top:14px; padding:14px 16px; border-radius:16px;
  background:rgba(19,27,46,0.85); border:1px solid var(--line);
  max-height:240px; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.logpanel h4{margin:0 0 8px; font-size:12px; letter-spacing:0.2em; color:var(--silver-dim); font-weight:600;}
.logrow{font-size:13px; line-height:1.6; padding:6px 0; border-top:1px solid var(--line); color:var(--silver);}
.logrow:first-of-type{border-top:none;}
.logrow .logsub{display:block; font-size:11px; color:var(--silver-dim); line-height:1.5;}
.errtext{color:#ffb3a4; font-size:13px; line-height:1.6; margin:10px 0 0;}

.divider{height:1px; background:var(--line); margin:20px 0;}
.resultlist{display:flex; flex-direction:column; gap:8px; margin:12px 0 6px;}
.resultrow{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px; background:var(--bg-panel-lighter); border:1px solid var(--line);}
.resultrow.dead .rname{text-decoration:line-through; color:var(--silver-dim);}
.center{text-align:center;}
.small{font-size:12px; color:var(--silver-dim);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- role definitions ---------- */
const ROLES = {
  wolf:     {name:'人狼',   emoji:'🐺', cls:'wolf',     desc:'夜、他の人狼と目を見交わし、村人を一人選んで襲撃する。正体を最後まで隠し通せ。'},
  villager: {name:'村人',   emoji:'👤', cls:'villager', desc:'特別な力はない。話し合いと観察だけを頼りに、人狼を見つけ出せ。'},
  seer:     {name:'占い師', emoji:'🔮', cls:'seer',     desc:'夜ごとに一人を選び、その者が人狼かどうかを見抜くことができる。'},
  hunter:   {name:'狩人',   emoji:'🛡️', cls:'hunter',   desc:'夜ごとに一人を選び、人狼の凶刃から守ることができる。'},
  president:{name:'社長',   emoji:'🎩', cls:'president',desc:'みんなで話し合い助け合おう。物忘れは激しく、言うことはコロコロと変わる。追放は私が決める。'},
  madman:   {name:'狂人',   emoji:'🃏', cls:'madman',   desc:'あなたは人狼陣営だが、人狼が誰かは知らない。人狼もあなたが誰かを知らない。特別な能力はないが、人狼陣営の勝利のために村を惑わせ。'},
  paparazzi:{name:'パパラッチ', emoji:'📸', cls:'paparazzi', desc:'占い師のように夜ごとに誰かの正体を調べられるが、あなたは人狼陣営に属している。人狼が誰かは知らず、人狼もあなたが誰かを知らない。占いでは人狼だと見抜かれない。'}
};

function calcWolfCount(n){ return Math.max(1, Math.floor(n/4)); }
// 各役職の合計が人数を超えないように、村人が最低0人になる範囲でクランプする
function clampRoleCounts(n, wolf, seer, hunter, president, madman, paparazzi){
  wolf = Math.max(1, wolf);
  seer = Math.max(0, seer);
  hunter = Math.max(0, hunter);
  president = Math.min(1, Math.max(0, president));
  madman = Math.max(0, madman);
  paparazzi = Math.max(0, paparazzi);
  let total = wolf + seer + hunter + president + madman + paparazzi;
  // 超過分は 狂人→狩人→占い師→社長→人狼(1人は残す) の順に削る
  while(total > n && paparazzi > 0){ paparazzi--; total--; }
  while(total > n && madman > 0){ madman--; total--; }
  while(total > n && hunter > 0){ hunter--; total--; }
  while(total > n && seer > 0){ seer--; total--; }
  while(total > n && president > 0){ president--; total--; }
  while(total > n && wolf > 1){ wolf--; total--; }
  return {wolf, seer, hunter, president, madman, paparazzi};
}

/* ---------- state ---------- */
let appMode = 'top'; // top | jinro | lottery | survey_choice | survey_free
let state = null;
function freshSetup(){
  const n = 8;
  return {
    screen:'setup',
    n,
    wolfCount: calcWolfCount(n),
    seerCount: 1,
    hunterCount: 1,
    presidentCount: 0,
    madmanCount: 0,
    paparazziCount: 0,
    revealOnExecution: false,  // 追放されたプレイヤーの役職をその場で公開するか
    revealOnAttack: false,     // 襲撃されたプレイヤーの役職をその場で公開するか
    pendingQueue: null,        // 次の夜の行動順(ランダム)
    names: Array.from({length:n}, (_,i)=>'プレイヤー'+(i+1)),
    players: [],
    confirmIdx:0,
    confirmPhase:'call',
    night:{ day:1, queue:[], qIdx:0, phase:'call', wolfTarget:null, seerTarget:null, seerResult:null, hunterTarget:null, villagerDummy:null, paparazziTarget:null, lockUntil:0 },
    lastHunterProtect:null,
    lastVictim:null,
    voteIdx:0,
    voteQueueIds:[],
    votes:{},
    lastExecuted:null,
    tieNote:false,
    executionNote:null,
    voteCandidates:null,   // 再投票時の投票対象(同率1位)のID配列。通常の投票ではnull
    revoteRound:0,         // その日の再投票の回数
    revoteInfo:null,
    log:[],                // 全員に公開されている情報のみを記録する
    setupError:null,
    winner:null,
    winReason:null
  };
}
state = freshSetup();
const MAX_REVOTES = 3;     // 再投票でも決まらない場合の上限(超えたら抽選)

function addLog(text, sub){ state.log.push({text, sub: sub||''}); }
function renderLogPanel(){
  if(state.screen==='setup' || state.log.length===0) return '';
  const rows = [...state.log].reverse().map(e=>`
    <div class="logrow">${escapeHtml(e.text)}${e.sub ? `<span class="logsub">${escapeHtml(e.sub)}</span>` : ''}</div>`).join('');
  return `<div class="logpanel"><h4>公開ログ(新しい順)</h4>${rows}</div>`;
}

function alivePlayers(){ return state.players.filter(p=>p.alive); }
function aliveWolfSide(){ return alivePlayers().filter(p=>p.role==='wolf' || p.role==='paparazzi'); }
function playerById(id){ return state.players.find(p=>p.id===id); }

/* ---------- render dispatch ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(appMode === 'top'){ html = screenTop(); }
  else if(appMode === 'lottery'){ html = renderLotteryScreen(); }
  else if(appMode === 'talk_theme'){ html = renderTalkThemeScreen(); }
  else if(appMode === 'insider'){ html = renderInsiderScreen(); }
  else if(appMode === 'wordwolf'){ html = renderWwScreen(); }
  else if(appMode === 'survey_choice'){ html = renderSurveyChoiceScreen(); }
  else if(appMode === 'survey_free'){ html = renderSurveyFreeScreen(); }
  else { html = renderJinroScreen() + renderLogPanel(); }
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function renderJinroScreen(){
  switch(state.screen){
    case 'setup': return screenSetup();
    case 'confirm': return screenConfirm();
    case 'night': return screenNight();
    case 'morning': return screenMorning();
    case 'day_vote': return screenVote();
    case 'revote_notice': return screenRevoteNotice();
    case 'execution': return screenExecution();
    case 'gameover': return screenGameOver();
    default: return screenSetup();
  }
}

/* ---------- TOP MENU ---------- */
function screenTop(){
  return `
  <div class="panel">
    <div class="eyebrow">レクリエーション</div>
    <h1>なにで遊ぶ?</h1>
    <p class="lead">端末を1台、参加者で回して遊べるミニゲーム集です。</p>
    <button class="btn btn-primary menubtn" onclick="enterJinro()">🐺 人狼<span class="sub">正体を隠して村を守れ・話し合いと投票のゲーム</span></button>
    <button class="btn btn-primary menubtn" onclick="enterLottery()">🎯 抽選<span class="sub">入力した候補からランダムに選ぶ・チーム分けも可能</span></button>
    <button class="btn btn-primary menubtn" onclick="enterInsider()">🕵️ インサイダーゲーム<span class="sub">お題を当てながら、お題を知る裏切り者を探す</span></button>
    <button class="btn btn-primary menubtn" onclick="enterWw()">🎭 ワードウルフ<span class="sub">少し違うお題を持つウルフを会話で探す</span></button>
    <button class="btn btn-primary menubtn" onclick="enterTalkTheme()">💬 トークテーマ<span class="sub">会話のきっかけになるお題をランダムに引く</span></button>
    <button class="btn btn-primary menubtn" onclick="enterSurveyChoice()">🗳️ アンケート(選択式)<span class="sub">選択肢から選んでもらい、匿名で集計</span></button>
    <button class="btn btn-primary menubtn" onclick="enterSurveyFree()">✏️ アンケート(自由入力)<span class="sub">自由記述で回答してもらい、匿名で一覧表示</span></button>
  </div>`;
}
function enterJinro(){ appMode='jinro'; state = freshSetup(); render(); }
function enterLottery(){ appMode='lottery'; lotteryState = freshLottery(); render(); }
function enterSurveyChoice(){ appMode='survey_choice'; surveyChoiceState = freshSurveyChoice(); render(); }
function enterSurveyFree(){ appMode='survey_free'; surveyFreeState = freshSurveyFree(); render(); }
function backToTop(){ appMode='top'; render(); }

/* ==================== TALK THEME ==================== */
const DEFAULT_TALK_THEMES = [
  '最近ハマっていることは?',
  '人生で一番の思い出は?',
  '今まで行った中で一番良かった場所は?',
  '子供の頃の夢は?',
  '最近感動したことは?',
  '好きな食べ物ベスト3',
  'もし1億円当たったら何に使う?',
  '尊敬する人は誰?',
  '今一番欲しいものは?',
  '休日の過ごし方は?',
  '学生時代の一番の思い出は?',
  '最近見て良かった映画やドラマは?',
  '自分の長所と短所は?',
  'もし1週間休みが取れたら何をする?',
  '好きな季節とその理由は?'
];
function freshTalkTheme(){
  return { phase:'setup', items:[...DEFAULT_TALK_THEMES], inputVal:'', pool:[], drawn:[] };
}
let talkThemeState = freshTalkTheme();
function enterTalkTheme(){ appMode='talk_theme'; talkThemeState = freshTalkTheme(); render(); }
function renderTalkThemeScreen(){
  return talkThemeState.phase==='setup' ? screenTalkThemeSetup() : screenTalkThemeDraw();
}
function screenTalkThemeSetup(){
  const s = talkThemeState;
  const chips = s.items.map((it,i)=>`<span class="chip">${escapeHtml(it)} <span class="x" onclick="removeTalkThemeItem(${i})">✕</span></span>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">トークテーマ</div>
    <h1>お題を確認・追加</h1>
    <p class="lead">定番のお題をあらかじめ入れています。不要なものは✕で消し、自由に追加もできます。</p>
    <label>お題</label>
    <div class="row">
      <input type="text" value="${escapeHtml(s.inputVal)}" oninput="setTalkThemeInput(this.value)" onkeydown="if(event.key==='Enter'){addTalkThemeItem();}" placeholder="お題を入力してEnter" style="flex:1;">
    </div>
    <button class="btn btn-primary" onclick="addTalkThemeItem()">追加する</button>
    <div class="chipwrap">${chips || '<p class="hint">お題がありません</p>'}</div>
    <button class="btn btn-primary" ${s.items.length<1?'disabled style="opacity:.4"':''} onclick="startTalkTheme()">このお題で始める(${s.items.length}件)</button>
  </div>`;
}
function setTalkThemeInput(v){ talkThemeState.inputVal = v; }
function addTalkThemeItem(){
  const v = talkThemeState.inputVal.trim();
  if(!v) return;
  talkThemeState.items.push(v);
  talkThemeState.inputVal = '';
  render();
}
function removeTalkThemeItem(i){ talkThemeState.items.splice(i,1); render(); }
function startTalkTheme(){
  talkThemeState.pool = [...talkThemeState.items];
  talkThemeState.drawn = [];
  talkThemeState.phase = 'draw';
  render();
}
function screenTalkThemeDraw(){
  const s = talkThemeState;
  const remaining = s.pool.length;
  const last = s.drawn[s.drawn.length-1];
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">トークテーマ</div>
    <h1>残り ${remaining} 件</h1>
    ${last ? `
      <div class="card3d"><div class="cardface pop-in">
        <div class="roleicon">💬</div>
        <div class="rolename" style="font-size:20px; line-height:1.5;">${escapeHtml(last)}</div>
      </div></div>
    ` : `<p class="lead">ボタンを押してお題を引いてください。</p>`}
    <button class="btn btn-danger" ${remaining===0?'disabled style="opacity:.4"':''} onclick="drawTalkTheme()">${remaining===0?'すべて出しました':'お題を引く!'}</button>
    ${s.drawn.length ? `
      <div class="divider"></div>
      <h3>出したお題</h3>
      <div class="resultlist">${s.drawn.map((it,i)=>`<div class="resultrow"><span class="rname">${i+1}. ${escapeHtml(it)}</span></div>`).join('')}</div>
    ` : ''}
    <button class="btn btn-primary" onclick="resetTalkTheme()">お題を編集してやり直す</button>
  </div>`;
}
function drawTalkTheme(){
  const s = talkThemeState;
  if(s.pool.length===0) return;
  const idx = Math.floor(Math.random()*s.pool.length);
  const [picked] = s.pool.splice(idx,1);
  s.drawn.push(picked);
  render();
}
function resetTalkTheme(){ talkThemeState.phase='setup'; talkThemeState.drawn=[]; render(); }

function moonMark(){
  return `<div class="daymark">第${state.night?state.night.day:1}夜</div><div class="moon"></div>`;
}

/* ---------- SETUP ---------- */
function screenSetup(){
  const names = state.names.map((nm,i)=>`
    <div class="nameitem">
      <div class="idx">${i+1}</div>
      <input type="text" value="${escapeHtml(nm)}" oninput="setName(${i}, this.value)">

  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">人狼 / GM代行</div>
    <h1>ゲームの準備</h1>
    <p class="lead">1台の端末を参加者で回して遊びます。人数と名前を決めて、夜の帳を開きましょう。</p>

    <label>参加人数(5〜15人)</label>
    <div class="stepper">
      <button onclick="changeN(-1)">−</button>
      <div class="val">${state.n}</div>

    </div>

    <label>人狼の人数</label>

    </div>

    <label>占い師の人数</label>
    <div class="stepper">
      <button onclick="changeRole('seer',-1)">−</button>
      <div class="val">${state.seerCount}</div>
      <button onclick="changeRole('seer',1)">+</button>
    </div>

    <label>狩人の人数</label>
    <div class="stepper">
      <button onclick="changeRole('hunter',-1)">−</button>
      <div class="val">${state.hunterCount}</div>
      <button onclick="changeRole('hunter',1)">+</button>
    </div>

    <label>社長の人数(0〜1人)</label>
    <div class="stepper">
      <button onclick="changeRole('president',-1)">−</button>
      <div class="val">${state.presidentCount}</div>
      <button onclick="changeRole('president',1)">+</button>
    </div>

    <label>狂人の人数(人狼陣営・能力なし)</label>
    <div class="stepper">
      <button onclick="changeRole('madman',-1)">−</button>
      <div class="val">${state.madmanCount}</div>
      <button onclick="changeRole('madman',1)">+</button>
    </div>
    <label>パパラッチの人数(人狼陣営の占い師)</label>
    <div class="stepper">
      <button onclick="changeRole('paparazzi',-1)">−</button>
      <div class="val">${state.paparazziCount}</div>
      <button onclick="changeRole('paparazzi',1)">+</button>
    </div>
    <p class="hint">村人 ${Math.max(0, state.n - state.wolfCount - state.seerCount - state.hunterCount - state.presidentCount - state.madmanCount - state.paparazziCount)}人 ・ 占い師 ${state.seerCount}人 ・ 狩人 ${state.hunterCount}人 ・ 社長 ${state.presidentCount}人 ・ 狂人 ${state.madmanCount}人 ・ パパラッチ ${state.paparazziCount}人 ・ 人狼 ${state.wolfCount}人</p>

    <label>追放されたプレイヤーの役職</label>
    <div class="row" style="gap:8px; margin-bottom:14px;">
      <button class="btn ${state.revealOnExecution?'':'btn-primary'}" style="margin:0;" onclick="setReveal('execution', false)">公開しない</button>
      <button class="btn ${state.revealOnExecution?'btn-primary':''}" style="margin:0;" onclick="setReveal('execution', true)">公開する</button>
    </div>
    <label>襲撃されたプレイヤーの役職</label>
    <div class="row" style="gap:8px; margin-bottom:6px;">
      <button class="btn ${state.revealOnAttack?'':'btn-primary'}" style="margin:0;" onclick="setReveal('attack', false)">公開しない</button>
      <button class="btn ${state.revealOnAttack?'btn-primary':''}" style="margin:0;" onclick="setReveal('attack', true)">公開する</button>
    </div>
    <p class="hint">「公開する」にすると、その場の発表・公開ログ・プレイヤー一覧のラベルに役職が表示されます。</p>

    <label>参加者の名前</label>
    <div class="namegrid">${names}</div>

    ${state.setupError ? `<p class="errtext">${escapeHtml(state.setupError)}</p>` : ''}
    <button class="btn btn-primary" onclick="startGame()">配役を決めて開始</button>
  </div>`;
}
function changeN(d){
  const n = Math.min(15, Math.max(5, state.n + d));
  if(n === state.n) return;
  state.setupError = null;
  state.n = n;
  if(n > state.names.length){
    while(state.names.length < n) state.names.push('プレイヤー'+(state.names.length+1));
  } else {
    state.names = state.names.slice(0,n);
  }
  const c = clampRoleCounts(n, state.wolfCount, state.seerCount, state.hunterCount, state.presidentCount, state.madmanCount, state.paparazziCount);
  state.wolfCount = c.wolf; state.seerCount = c.seer; state.hunterCount = c.hunter; state.presidentCount = c.president; state.madmanCount = c.madman; state.paparazziCount = c.paparazzi;
  render();
}
function changeRole(role, d){
  const w = state.wolfCount + (role==='wolf'?d:0);
  const s = state.seerCount + (role==='seer'?d:0);
  const h = state.hunterCount + (role==='hunter'?d:0);
  const pr = state.presidentCount + (role==='president'?d:0);
  const md = state.madmanCount + (role==='madman'?d:0);
  const pp = state.paparazziCount + (role==='paparazzi'?d:0);
  if(w < 1 || s < 0 || h < 0 || pr < 0 || pr > 1 || md < 0 || pp < 0) return;
  if(w + s + h + pr + md + pp > state.n) return;
  state.setupError = null;
  state.wolfCount = w; state.seerCount = s; state.hunterCount = h; state.presidentCount = pr; state.madmanCount = md; state.paparazziCount = pp;
  render();
}
function setReveal(kind, on){
  if(kind === 'execution') state.revealOnExecution = on;
  else state.revealOnAttack = on;
  render();
}
function setName(i,v){ state.names[i] = v; }

function startGame(){
  const n = state.n, w = state.wolfCount, s = state.seerCount, h = state.hunterCount, pr = state.presidentCount, md = state.madmanCount, pp = state.paparazziCount;
  const names = state.names.map((nm,i)=> nm.trim() || ('プレイヤー'+(i+1)));

  // 名前に「山口」を含む参加者は人狼陣営(人狼・狂人・パパラッチ)にならない
  const wolfSideRoles = [];
  for(let i=0;i<w;i++) wolfSideRoles.push('wolf');
  for(let i=0;i<md;i++) wolfSideRoles.push('madman');
  for(let i=0;i<pp;i++) wolfSideRoles.push('paparazzi');
  const eligible = names.map((_,i)=>i).filter(i=>!names[i].includes('山口'));
  if(eligible.length < wolfSideRoles.length){
    state.setupError = `人狼陣営の役職を割り当てられる参加者が足りません(候補${eligible.length}人/人狼陣営${wolfSideRoles.length}人)。人狼・狂人・パパラッチの人数を減らしてください。`;
    render();
    return;
  }
  state.setupError = null;

  // 人狼陣営の役職は、条件を満たす参加者の中からランダムに割り当てる
  const pool = [...eligible];
  shuffle(pool);
  const roles = new Array(n).fill(null);
  wolfSideRoles.forEach((role, k)=>{ roles[pool[k]] = role; });

  // 残りの役職(占い師・狩人・社長・村人)を、空いている席にランダムに割り当てる
  const others = [];
  for(let i=0;i<s;i++) others.push('seer');
  for(let i=0;i<h;i++) others.push('hunter');
  for(let i=0;i<pr;i++) others.push('president');
  while(others.length < n - wolfSideRoles.length) others.push('villager');
  shuffle(others);
  let k2 = 0;
  for(let i=0;i<n;i++){ if(roles[i] === null) roles[i] = others[k2++]; }

  state.players = names.map((nm,i)=>({id:i, name: nm, role: roles[i], alive:true, deathCause:null}));
  state.log = [];
  addLog(`ゲーム開始(参加${n}人)`);
  state.pendingQueue = shuffledAliveIds();
  state.confirmIdx = 0;
  state.confirmPhase = 'call';
  state.screen = 'confirm';
  render();
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- CONFIRM ROLE (per-player, private) ---------- */
/* 受け渡し画面の共通部品(名前入りの説明文) */
function san(p){ return escapeHtml(p.name) + 'さん'; }
function callScreen(eyebrow, p, onclickJs, buttonText){
  // 端末を受け取った本人が押す画面
  return `
  <div class="panel callwrap">
    ${eyebrow}
    <div class="who">${san(p)}の番です</div>
    <div class="msg">${san(p)}:端末を受け取ったら、周りの人に画面が見えないようにしてから、${san(p)}自身がボタンを押してください。</div>
    <button class="btn btn-primary" onclick="${onclickJs}">${buttonText}</button>
  </div>`;
}
function passScreen(eyebrow, from, to, onclickJs){
  // 直前のプレイヤー(from)が押してから、次のプレイヤー(to)へ渡す画面
  return `
  <div class="panel callwrap">
    ${eyebrow}
    <div class="who">${san(from)}から${san(to)}へ</div>
    <div class="msg">${san(from)}:下のボタンを押してから、端末を${san(to)}に渡してください。</div>
    <button class="btn btn-primary" onclick="${onclickJs}">押して、次の人に渡す</button>
  </div>`;
}
function screenConfirm(){
  const p = state.players[state.confirmIdx];
  const eyebrow = `<div class="eyebrow">配役の確認 ${state.confirmIdx+1} / ${state.players.length}</div>`;
  if(state.confirmPhase === 'call'){
    return callScreen(eyebrow, p, 'confirmReveal()', '役職を確認する');
  }
  if(state.confirmPhase === 'reveal'){
    const r = ROLES[p.role];
    return `
    <div class="panel">
      <div class="eyebrow">${san(p)}の役職</div>
      <div class="card3d">
        <div class="cardface">
          <div class="roleicon">${r.emoji}</div>
          <div class="rolename">${r.name}</div>
          <div class="roledesc">${r.desc}</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="confirmDone()">${san(p)}:確認した</button>
    </div>`;
  }
  // pass: 最後の人の次は、夜の最初のプレイヤー(全員生存)
  const next = state.players[state.confirmIdx+1] || playerById(state.pendingQueue[0]);
  const eb = state.players[state.confirmIdx+1]
    ? '<div class="eyebrow">受け渡し</div>'
    : '<div class="eyebrow">全員の確認が終わりました。夜が始まります</div>';
  return passScreen(eb, p, next, 'confirmAdvance()');
}
function confirmReveal(){ state.confirmPhase = 'reveal'; render(); }
function confirmDone(){ state.confirmPhase = 'pass'; render(); }
function confirmAdvance(){
  if(state.confirmIdx+1 < state.players.length){
    state.confirmIdx += 1;
    state.confirmPhase = 'call';
    render();
  } else {
    beginNight();
  }
}

/* ---------- NIGHT ---------- */
function beginNight(){
  // 全プレイヤーが同じ手順で端末を回す(誰が特別な役職か分からないようにするため)。順番は毎晩ランダム
  state.night.queue = state.pendingQueue || shuffledAliveIds();
  state.pendingQueue = null;
  state.night.qIdx = 0;
  state.night.phase = 'call';
  state.night.wolfTarget = null;
  state.night.seerTarget = null;
  state.night.paparazziTarget = null;
  state.night.seerResult = null;
  state.night.hunterTarget = null;
  state.night.villagerDummy = null;
  state.screen = 'night';
  render();
}
function shuffledAliveIds(){
  const q = alivePlayers().map(p=>p.id);
  shuffle(q);
  return q;
}
/* 行動画面(プレイヤーを選ぶ画面)は表示から5秒間ボタンを押せない。
   役職によって操作にかかる時間が違うことで、役職が推測されるのを防ぐ。 */
const ACT_LOCK_MS = 5000;
let actLockTimer = null;
function actLocked(){ return state.screen==='night' && state.night.phase==='act' && Date.now() < (state.night.lockUntil||0); }
function startActLock(){
  state.night.lockUntil = Date.now() + ACT_LOCK_MS;
  if(actLockTimer) clearInterval(actLockTimer);
  actLockTimer = setInterval(tickActLock, 200);
}
function tickActLock(){
  if(!(state.screen==='night' && state.night.phase==='act')){ clearInterval(actLockTimer); actLockTimer = null; return; }
  const remain = (state.night.lockUntil||0) - Date.now();
  const hint = document.getElementById('lockhint');
  if(remain > 0){
    if(hint) hint.textContent = `あと${Math.ceil(remain/1000)}秒で選べるようになります`;
    return;
  }
  clearInterval(actLockTimer); actLockTimer = null;
  if(hint) hint.remove();
  const grid = document.getElementById('actgrid');
  if(grid) grid.classList.remove('lockedgrid');
  const btn = document.getElementById('actDecideBtn');
  if(btn){
    const f = btn.getAttribute('data-field');
    const needTarget = f && state.night[f] === null;
    btn.disabled = !!needTarget;
    btn.style.opacity = needTarget ? '.4' : '1';
  }
}
function actGridAttrs(){ return `id="actgrid" class="playergrid${actLocked() ? ' lockedgrid' : ''}"`; }
function actHint(){ return actLocked() ? `<p class="hint lockhint" id="lockhint">あと${Math.ceil(((state.night.lockUntil||0)-Date.now())/1000)}秒で選べるようになります</p>` : ''; }
function actBtnAttrs(field){
  const dis = actLocked() || (field && state.night[field] === null);
  return `id="actDecideBtn" data-field="${field}" ${dis ? 'disabled style="opacity:.4"' : ''}`;
}
function aliveOfRole(role){ return state.players.find(p=>p.alive && p.role===role); }

function screenNight(){
  const p = playerById(state.night.queue[state.night.qIdx]);
  const role = p.role;
  const phase = state.night.phase;

  if(phase === 'call'){
    const eyebrow = `${moonMark()}<div class="eyebrow">夜がふける ${state.night.qIdx+1} / ${state.night.queue.length}</div>`;
    return callScreen(eyebrow, p, 'nightAct()', '確認する');
  }

  if(phase === 'act'){
    if(role === 'villager' || role === 'president' || role === 'madman'){
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>targetRow(q, state.night.villagerDummy, `pick('villagerDummy', ${q.id})`, null)).join('');
      return `
      <div class="panel">
        <div class="eyebrow">夜の行動</div>
        <h3>誰かを選んでください</h3>
        <p class="hint">あなたには特別な夜の行動はありません。この選択に意味はありません。誰でもよいので一人選んで進んでください。</p>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-primary" ${actBtnAttrs('villagerDummy')} onclick="nightConfirmAct()">決定</button>
      </div>`;
    }
    if(role === 'wolf'){
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>{
        let disabledReason = null;
        if(q.alive && q.role==='wolf') disabledReason = '人狼';
        return targetRow(q, state.night.wolfTarget, `pick('wolfTarget', ${q.id})`, disabledReason);
      }).join('');
      return `
      <div class="panel">
        <div class="eyebrow">人狼の襲撃先</div>
        <h3>誰を襲いますか?</h3>
        <p class="hint">あなたより先に他の人狼が襲撃先を選んでいれば、それに従うか襲撃先を変えることが出来ます。最後の人狼が選んだプレイヤーを襲撃します。</p>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-danger" ${actBtnAttrs('wolfTarget')} onclick="nightConfirmAct()">この人を襲う</button>
      </div>`;
    }
    if(role === 'seer' || role === 'paparazzi'){
      const field = role==='paparazzi' ? 'paparazziTarget' : 'seerTarget';
      const targets = state.players.filter(q=>q.id!==p.id);
      const rows = targets.map(q=>targetRow(q, state.night[field], `pick('${field}', ${q.id})`, null)).join('');
      return `
      <div class="panel">
        <div class="eyebrow">${role==='paparazzi' ? 'パパラッチの目' : '占い師の力'}</div>
        <h3>誰を調べますか?</h3>
        ${actHint()}
        <div ${actGridAttrs()}>${rows}</div>
        <button class="btn btn-primary" ${actBtnAttrs(field)} onclick="nightConfirmAct()">調べる</button>
      </div>`;
    }
    // hunter(自分自身も対象に含む)
    const rows = state.players.map(q=>{
      const note = state.lastHunterProtect===q.id ? '前回護衛' : null;
      return targetRow(q, state.night.hunterTarget, `pick('hunterTarget', ${q.id})`, null, note);
    }).join('');
    return `
    <div class="panel">
      <div class="eyebrow">狩人の力</div>
      <h3>誰を守りますか?</h3>
      ${actHint()}
      <div ${actGridAttrs()}>${rows}</div>
      <button class="btn btn-primary" ${actBtnAttrs('hunterTarget')} onclick="nightConfirmAct()">守る</button>
    </div>`;
  }

  if(phase === 'result'){
    if(role === 'seer' || role === 'paparazzi'){
      const field = role==='paparazzi' ? 'paparazziTarget' : 'seerTarget';
      const t = playerById(state.night[field]);
      const isWolf = t.role === 'wolf';
      return `
      <div class="panel">
        <div class="card3d">
          <div class="cardface">
            <div class="roleicon">${isWolf?'🐺':'✨'}</div>
            <div class="rolename">${escapeHtml(t.name)} さんは</div>
            <div class="roledesc" style="font-size:18px; color:${isWolf?'#ffb3a4':'var(--silver)'}">${isWolf?'人狼である':'人狼ではない'}</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="nightPass()">${san(p)}:確認した</button>
      </div>`;
    }
    // villager / wolf / hunter / 社長 は同じ見た目の確認画面(誰が何をしたか分からないようにする)
    const label = role==='wolf' ? '選択を決めた' : role==='hunter' ? '選択を決めた' : '確認した';
    return `
    <div class="panel callwrap">
      <div class="who">${label}</div>
      <div class="msg">この画面の内容は誰にも明かさないでください。</div>
      <button class="btn btn-primary" onclick="nightPass()">${san(p)}:確認した</button>
    </div>`;
  }

  // phase === 'pass'
  const nextIdx = state.night.qIdx+1;
  const hasNext = nextIdx < state.night.queue.length;
  if(hasNext){
    const nextP = playerById(state.night.queue[nextIdx]);
    return passScreen(`${moonMark()}<div class="eyebrow">受け渡し</div>`, p, nextP, 'nightAdvance()');
  }
  return `
  <div class="panel callwrap">
    ${moonMark()}
    <div class="eyebrow">全員の行動が終わりました</div>
    <div class="who">${san(p)}、夜が明けます</div>
    <div class="msg">${san(p)}:下のボタンを押してから、端末を全員に見える場所に置いてください。</div>
    <button class="btn btn-primary" onclick="nightAdvance()">押して朝を迎える</button>
  </div>`;
}
function pick(field, id){ if(actLocked()) return; state.night[field] = id; render(); }
// 設定で「公開する」にしている退場理由の場合のみ、役職名を返す(それ以外はnull)
function revealedRoleOf(q){
  const on = (q.deathCause==='executed' && state.revealOnExecution) || (q.deathCause==='killed' && state.revealOnAttack);
  return on ? ROLES[q.role].name : null;
}
function roleBadgeHtml(q){
  const r = ROLES[q.role];
  return `<div class="badge ${r.cls}" style="margin-top:8px;">${r.emoji} ${r.name}だった</div>`;
}
function deathStatus(q){
  const base = q.deathCause==='executed' ? '追放' : '死亡';
  const r = revealedRoleOf(q);
  return r ? `${base}(${r})` : base;
}
function targetRow(q, selectedId, onclickJs, disabledReason, note){
  let status = null, disabled = false;
  if(!q.alive){ status = deathStatus(q); disabled = true; }
  else if(disabledReason){ status = disabledReason; disabled = true; }
  const cls = ['pbtn'];
  if(disabled) cls.push(q.alive ? 'locked' : 'dead');
  if(!disabled && selectedId===q.id) cls.push('selected');
  const onclickAttr = disabled ? '' : ` onclick="${onclickJs}"`;
  const tag = status ? `<span class="tag">${status}</span>` : (!disabled && note ? `<span class="tag">${note}</span>` : '');
  return `<div class="${cls.join(' ')}"${onclickAttr}>
    <span>${escapeHtml(q.name)}</span>
    ${tag}
  </div>`;
}
function nightAct(){ state.night.phase = 'act'; startActLock(); render(); }
function nightConfirmAct(){ if(actLocked()) return; state.night.phase = 'result'; render(); }
function nightPass(){ state.night.phase = 'pass'; render(); }
function nightAdvance(){
  const nextIdx = state.night.qIdx+1;
  if(nextIdx < state.night.queue.length){
    state.night.qIdx = nextIdx;
    state.night.phase = 'call';
    state.night.villagerDummy = null; // 村人の選択は演技用なので毎回リセット
    render();
  } else {
    resolveNight();
  }
}
function resolveNight(){
  const wolfTarget = state.night.wolfTarget;
  const hunterTarget = state.night.hunterTarget;
  let victimId = null;
  if(wolfTarget !== null && wolfTarget !== hunterTarget){
    victimId = wolfTarget;
  }
  state.lastVictim = victimId;
  if(victimId !== null){ const v = playerById(victimId); v.alive = false; v.deathCause = 'killed'; }
  state.lastHunterProtect = hunterTarget;
  // 公開情報のみ記録(誰が襲撃を指示したか・誰が守ったかは記録しない)
  if(victimId !== null){
    const v = playerById(victimId);
    const rv = revealedRoleOf(v);
    addLog(`第${state.night.day}日の朝:${v.name}さんが襲撃された${rv ? '(役職:'+rv+')' : ''}`);
  }
  else addLog(`第${state.night.day}日の朝:犠牲者はいなかった`);
  state.screen = 'morning';
  render();
}

/* ---------- 勝敗判定 ----------
   村人陣営の勝利: 「人狼」が全滅したとき(パパラッチ・狂人が生存していても。襲撃できる人狼がいないため)
   人数の数え方: 人狼側 = 人狼 + パパラッチ / 村人陣営 = それ以外の生存者(狂人は人数の上では村人側に数える)
   ※ 狂人・パパラッチは人狼陣営として勝敗を共にする(人狼陣営が勝てば勝ち)
   ・人狼が全滅 → 村人陣営の勝利
   ・襲撃の結果: 村人陣営の人数が人狼と同数以下 → 人狼陣営の勝利
   ・追放の結果: 村人陣営の人数が人狼より少ない → 人狼陣営の勝利
                 村人陣営の人数が人狼と同数、または人狼より1人多い状態で、狩人が生存していなければ → 人狼陣営の勝利
                 (狩人が生存している場合は、護衛で襲撃を防げる可能性があるため続行) */
function countSides(){
  const wolfSide = aliveWolfSide().length;
  const wolves = alivePlayers().filter(p=>p.role==='wolf').length;   // 襲撃できる「人狼」そのものの人数
  return { wolves, wolfSide, villageSide: alivePlayers().length - wolfSide };
}
function checkWinAfterAttack(){
  const {wolves, wolfSide, villageSide} = countSides();
  if(wolves === 0) return {winner:'villagers', reason:'wolves_eliminated'};
  if(villageSide <= wolfSide) return {winner:'wolves', reason:'attack_parity'};
  return null;
}
function checkWinAfterExecution(){
  const {wolves, wolfSide, villageSide} = countSides();
  if(wolves === 0) return {winner:'villagers', reason:'wolves_eliminated'};
  if(villageSide < wolfSide) return {winner:'wolves', reason:'execution_below'};
  const hunterAlive = state.players.some(p=>p.alive && p.role==='hunter');
  if(!hunterAlive){
    if(villageSide === wolfSide) return {winner:'wolves', reason:'execution_parity'};
    if(villageSide === wolfSide + 1) return {winner:'wolves', reason:'execution_lead'};
  }
  return null;
}
function finishGame(result){
  state.winner = result.winner;
  state.winReason = result.reason;
  addLog('ゲーム終了:' + (result.winner==='villagers' ? '村人陣営の勝利' : '人狼陣営の勝利'));
  state.screen = 'gameover';
  render();
}

/* ---------- DAY VOTE (open, public) ---------- */
function beginVote(){
  // その日の最初の投票(再投票の状態をリセット)
  state.revoteRound = 0;
  state.voteCandidates = null;
  state.voteQueueIds = alivePlayers().map(p=>p.id);
  state.voteIdx = 0;
  state.votes = {};
  state.screen = 'day_vote';
  render();
}
function beginRevote(){
  // 同率1位だけを対象にした再投票(投票するのは生存者全員)
  state.voteQueueIds = alivePlayers().map(p=>p.id);
  state.voteIdx = 0;
  state.votes = {};
  state.screen = 'day_vote';
  render();
}
function screenVote(){
  const voterId = state.voteQueueIds[state.voteIdx];
  const voter = playerById(voterId);
  const cands = state.voteCandidates;
  const targets = state.players.filter(p=>p.id !== voterId);
  const rows = targets.map(p=>{
    const reason = (cands && p.alive && !cands.includes(p.id)) ? '対象外' : null;
    return targetRow(p, state.votes[voterId], `castVote(${voterId}, ${p.id})`, reason);
  }).join('');
  const eyebrow = cands
    ? `再投票(${state.revoteRound}回目)・${state.voteIdx+1} / ${state.voteQueueIds.length}`
    : `話し合い・投票 ${state.voteIdx+1} / ${state.voteQueueIds.length}`;
  const hint = cands
    ? `同率1位の ${cands.map(id=>escapeHtml(playerById(id).name)+'さん').join('・')} の中から選んでください。投票は公開で行います。`
    : '投票は公開で行います。話し合ってから選んでください。';
  return `
  <div class="panel">
    <div class="eyebrow">${eyebrow}</div>
    <h3>${san(voter)}は誰に投票しますか?</h3>
    <p class="hint">${hint}</p>
    <div class="playergrid">${rows}</div>
    <button class="btn btn-primary" ${state.votes[voterId]===undefined?'disabled style="opacity:.4"':''} onclick="voteAdvance()">${san(voter)}の投票を確定</button>
  </div>`;
}
function castVote(voterId, targetId){ state.votes[voterId] = targetId; render(); }
function voteAdvance(){
  if(state.voteIdx+1 < state.voteQueueIds.length){
    state.voteIdx += 1;
    render();
  } else {
    resolveVote();
  }
}
function resolveVote(){
  const tally = {};
  Object.values(state.votes).forEach(t => { tally[t] = (tally[t]||0)+1; });
  let max = -1, leaders = [];
  Object.entries(tally).forEach(([id,c])=>{
    id = Number(id);
    if(c > max){ max = c; leaders = [id]; }
    else if(c === max){ leaders.push(id); }
  });
  state.tieNote = leaders.length > 1;
  const day = state.night.day;

  // 投票結果をログへ(得票数のみ。誰が誰に投票したかは記録しない)
  const tallyText = Object.entries(tally).sort((a,b)=>b[1]-a[1])
    .map(([id,c])=>`${playerById(Number(id)).name} ${c}票`).join(' / ');
  addLog(`第${day}日 ${state.revoteRound>0 ? '再投票('+state.revoteRound+'回目)' : '投票'}結果:${tallyText}`);

  // 社長ルール: 最多得票が社長単独ならそのまま社長が追放される。
  // そうでなければ、票数にかかわらず社長が投票したプレイヤーが追放される(この場合は再投票なし)。
  const president = state.players.find(p=>p.alive && p.role==='president');
  let executedId = null;
  let executionNote = null;
  if(president && !(leaders.length===1 && leaders[0]===president.id)){
    const target = state.votes[president.id];
    executedId = (target !== undefined) ? target : (leaders.length ? leaders[Math.floor(Math.random()*leaders.length)] : null);
    // 社長の投票先が最多得票(同数トップ含む)に入っていなければ「社長指名により追放」
    executionNote = leaders.includes(executedId) ? (leaders.length > 1 ? 'president_tiebreak' : null) : 'president';
  } else if(leaders.length === 1){
    executedId = leaders[0];
    if(state.revoteRound > 0) executionNote = 'revote';
  } else if(leaders.length > 1){
    if(state.revoteRound < MAX_REVOTES){
      // 同率1位が複数 → 同率1位だけを対象に再投票
      state.revoteRound += 1;
      state.voteCandidates = leaders;
      state.revoteInfo = leaders.map(id=>({id, count: tally[id]}));
      addLog(`第${day}日:同数のため再投票(${state.revoteRound}回目)`, '対象:' + leaders.map(id=>playerById(id).name).join('・'));
      state.screen = 'revote_notice';
      render();
      return;
    }
    // 再投票を繰り返しても決まらない場合は、同率1位の中から抽選
    executedId = leaders[Math.floor(Math.random()*leaders.length)];
    executionNote = 'random';
  }

  state.lastExecuted = executedId;
  state.executionNote = executionNote;
  if(executedId !== null){
    const e = playerById(executedId);
    e.alive = false; e.deathCause = 'executed';
    const noteText = executionNote==='president' ? '(社長指名により追放)' : executionNote==='president_tiebreak' ? '(同数票のため社長の投票先で決定)' : executionNote==='revote' ? '(再投票の結果)' : executionNote==='random' ? '(再投票でも同数のため抽選)' : '';
    const re = revealedRoleOf(e);
    addLog(`第${day}日:${e.name}さんが追放された${noteText}${re ? '(役職:'+re+')' : ''}`);
  } else {
    addLog(`第${day}日:追放者なし`);
  }
  state.screen = 'execution';
  render();
}
function screenRevoteNotice(){
  const rows = state.revoteInfo.map(x=>`
    <div class="resultrow"><span class="rname">${escapeHtml(playerById(x.id).name)}さん</span><span class="small">${x.count}票</span></div>`).join('');
  return `
  <div class="panel callwrap">
    <div class="eyebrow">同数票</div>
    <div class="who">再投票を行います(${state.revoteRound}回目)</div>
    <div class="msg">同率1位の中から、追放する人を選び直します。<br>${state.revoteRound >= MAX_REVOTES ? '※ これでも決まらない場合は抽選で決定します。' : ''}</div>
    <div class="resultlist" style="text-align:left;">${rows}</div>
    <button class="btn btn-primary" style="margin-top:20px;" onclick="beginRevote()">再投票を始める</button>
  </div>`;
}

        : state.executionNote==='president_tiebreak' ? '<div class="hint">※ 同数票のため、社長の投票先で決定しました。</div>'

}
function resetGame(){
  const prevNames = state.players.length ? state.players.map(p=>p.name) : state.names;
  const prevN = state.players.length ? state.players.length : state.n;
  state = freshSetup();
  state.n = prevN;
  state.names = prevNames.slice(0, prevN);
  while(state.names.length < prevN) state.names.push('プレイヤー'+(state.names.length+1));
  state.wolfCount = calcWolfCount(prevN);
  render();
}

function setLotteryMode(m){ lotteryState.mode = m; render(); }
function setLotteryInput(v){ lotteryState.inputVal = v; }
function addLotteryItem(){

function removeLotteryItem(i){ lotteryState.items.splice(i,1); render(); }
function changeTeamCount(d){

function screenLotteryDraw(){

function surveyChoiceConfirm(){ surveyChoiceState.subPhase='pass'; render(); }
function surveyChoiceAdvance(){

function screenSurveyChoiceResults(){
  const s = surveyChoiceState;
  const total = s.answers.filter(a=>a!==null).length;

  const maxCount = Math.max(...tally, 1);
  const rows = s.options.map((op,i)=>{

function pickInsiderWord(genreKey){
  const pool = genreKey === 'all'
    ? Object.entries(INSIDER_GENRES).filter(([k])=>k!=='all').flatMap(([k,g])=>g.words.map(w=>({w, label:g.label})))
    : INSIDER_GENRES[genreKey].words.map(w=>({w, label:INSIDER_GENRES[genreKey].label}));
  let cands = pool.filter(x=>!insiderUsedWords.has(x.w));
  if(cands.length === 0){ pool.forEach(x=>insiderUsedWords.delete(x.w)); cands = pool; }
  const pick = cands[Math.floor(Math.random()*cands.length)];
  insiderUsedWords.add(pick.w);
  return pick;
}
function startInsider(){
  const s = insiderState;
  const players = s.names.map((nm,i)=>({id:i, name: nm.trim() || ('プレイヤー'+(i+1)), role:'citizen'}));
  const order = players.map((_,i)=>i);
  shuffle(order);
  players[order[0]].role = 'master';
  players[order[1]].role = 'insider';
  const pick = pickInsiderWord(s.genre);
  s.players = players;
  s.word = pick.w;
  s.wordGenreLabel = pick.label;
  s.idx = 0;
  s.subPhase = 'call';
  s.extensions = 0;
  s.revealRoles = false;
  s.phase = 'confirm';
  render();
}

const INSIDER_REVEAL_LOCK_MS = 3000;
let insiderLockTimer = null;
function insiderRevealLocked(){
  const s = insiderState;

}
function insiderReveal(){
  const s = insiderState;

  insiderLockTimer = setInterval(tickInsiderLock, 200);

}
function tickInsiderLock(){
  const s = insiderState;
  if(!(appMode === 'insider' && s.phase === 'confirm' && s.subPhase === 'reveal')){ clearInterval(insiderLockTimer); insiderLockTimer = null; return; }
  const remain = (s.lockUntil || 0) - Date.now();

function insiderDone(){

/* ---- countdown ---- */
function fmtTime(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(t/60), sec = t % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}
function startInsiderCountdown(ms){
  const s = insiderState;
  s.segmentMs = ms;
  s.endAt = Date.now() + ms;
  s.phase = 'countdown';
  if(insiderTimer) clearInterval(insiderTimer);
  insiderTimer = setInterval(tickInsider, 200);
  render();
}
function tickInsider(){
  const s = insiderState;
  if(!(appMode === 'insider' && s.phase === 'countdown')){ clearInterval(insiderTimer); insiderTimer = null; return; }
  const remain = s.endAt - Date.now();
  const el = document.getElementById('insTimer');
  const bar = document.getElementById('insBar');
  if(el) el.textContent = fmtTime(remain);
  if(bar) bar.style.width = Math.max(0, Math.min(100, remain / s.segmentMs * 100)) + '%';
  if(remain <= 0){
    clearInterval(insiderTimer); insiderTimer = null;
    s.phase = 'timeup';
    insiderBeep();
    render();
  }
}

/* ---- sound ---- */
function insiderPrepareAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!insiderAudioCtx) insiderAudioCtx = new AC();
    if(insiderAudioCtx.state === 'suspended') insiderAudioCtx.resume();
  }catch(e){}
}
function insiderBeep(){
  try{
    if(insiderAudioCtx){
      for(let i=0;i<3;i++){
        const o = insiderAudioCtx.createOscillator();
        const g = insiderAudioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.25;
        o.connect(g); g.connect(insiderAudioCtx.destination);
        const t = insiderAudioCtx.currentTime + i*0.4;
        o.start(t); o.stop(t + 0.2);
      }
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

function pickWwPair(genreKey){
  const pool = genreKey === 'all'
    ? Object.entries(WW_GENRES).filter(([k])=>k!=='all').flatMap(([k,g])=>g.pairs.map(pr=>({pr, label:g.label})))
    : WW_GENRES[genreKey].pairs.map(pr=>({pr, label:WW_GENRES[genreKey].label}));
  const key = x => x.pr.join('/');
  let cands = pool.filter(x=>!wwUsedPairs.has(key(x)));
  if(cands.length === 0){ pool.forEach(x=>wwUsedPairs.delete(key(x))); cands = pool; }
  const pick = cands[Math.floor(Math.random()*cands.length)];
  wwUsedPairs.add(key(pick));
  // どちらを市民のお題にするかもランダム
  const swap = Math.random() < 0.5;
  return { citizen: swap ? pick.pr[1] : pick.pr[0], wolf: swap ? pick.pr[0] : pick.pr[1], label: pick.label };
}
function startWw(){
  const s = wwState;

  for(let k=0;k<s.wolves;k++) players[order[k]].wolf = true;

  s.players = players;
  s.citizenWord = pair.citizen;

  s.genreLabel = pair.label;
  s.idx = 0;
  s.subPhase = 'call';
  s.extensions = 0;
  s.phase = 'confirm';
  render();
}

      <button class="btn btn-danger" onclick="wwShowResult()">ウルフを表示する</button>
      <button class="btn btn-sub" onclick="wwCancelEnd()">カウントダウンに戻る</button>
    ` : `
      <button class="btn btn-sub" onclick="wwAskEnd()">時間前にウルフを表示する</button>
    `}
  </div>`;
}
function wwAskEnd(){ wwState.confirmEnd = true; render(); }
function wwCancelEnd(){ wwState.confirmEnd = false; render(); }
function screenWwTimeup(){
  const s = wwState;
  return `
  <div class="panel callwrap">
    <div class="eyebrow">タイムアップ</div>
    <div class="who">時間切れです</div>
    <div class="msg">まだ話し合いを続けるなら延長、投票が済んだらウルフを表示します。${s.extensions>0 ? '<br>(これまでの延長:'+s.extensions+'回)' : ''}</div>
    <button class="btn btn-primary" onclick="wwExtend()">延長する(+${Math.round(WW_EXTEND_MS/60000*10)/10}分)</button>
    <button class="btn btn-danger" onclick="wwShowResult()">延長しない(ウルフを表示)</button>
  </div>`;
}
function wwExtend(){
  insiderPrepareAudio();
  wwState.extensions += 1;
  startWwCountdown(WW_EXTEND_MS);
}
function wwShowResult(){
  if(wwTimer){ clearInterval(wwTimer); wwTimer = null; }
  wwState.confirmEnd = false;
  wwState.phase = 'result';
  render();
}

/* ---- result ---- */
function screenWwResult(){
  const s = wwState;
  const wolves = s.players.filter(p=>p.wolf);
  const rows = wolves.map(p=>`<div class="resultrow"><span class="rname">${san(p)}</span><span class="badge wolf">🐺 ウルフ</span></div>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow center" style="text-align:center;">結果発表(${escapeHtml(s.genreLabel)})</div>
    <h1 class="center" style="text-align:center;">ウルフは…</h1>
    <div class="resultlist">${rows}</div>
    <div class="divider"></div>
    <div class="resultlist">
      <div class="resultrow"><span class="small">市民のお題</span><span class="rname">${escapeHtml(s.citizenWord)}</span></div>
      <div class="resultrow"><span class="small">ウルフのお題</span><span class="rname">${escapeHtml(s.wolfWord)}</span></div>
    </div>
    <p class="hint">ウルフが見破られた場合は、ウルフが市民のお題を当てられれば逆転勝利、というルールでも遊べます。</p>
    <button class="btn btn-primary" onclick="startWw()">もう一度遊ぶ(同じ設定)</button>
    <button class="btn btn-sub" onclick="wwBackToSetup()">設定に戻る</button>
  </div>`;
}
function wwBackToSetup(){ wwState.phase = 'setup'; render(); }


render();
</script>
</body>
</html>
