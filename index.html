  '家では裸で過ごしていそうな人','露出に興味がありそうな人','見られるのが好きそうな人','匂いフェチそうな人',
  '脚フェチそうな人','胸フェチそうな人','お尻フェチそうな人','手フェチそうな人',
  'うなじフェチそうな人','ナース服やメイド服が好きそうな人','ボディタッチが多そうな人','スキンシップが好きそうな人',
  '耳元でささやかれると弱そうな人','首筋が弱そうな人','ベッドでは別人になりそうな人','普段は真面目だけど夜は豹変しそうな人',
  '普段は大人しいのに夜は積極的になりそうな人','一目惚れした相手とすぐ寝てしまいそうな人','合コンでお持ち帰りを狙っていそうな人','合コンで一番モテそうな人',
  '合コンで一番ガツガツしていそうな人','合コンで連絡先を聞きまくりそうな人','友達の恋人を好きになってしまいそうな人','職場の人と秘密の関係になりそうな人',
  '職場恋愛を隠し通していそうな人','元恋人と今も体の関係が続いていそうな人','複数の人と同時に付き合っていそうな人','二股をかけていそうな人',
  '三股をかけていそうな人','浮気がバレても堂々としていそうな人','浮気を絶対にバレないようにしていそうな人','浮気されても許してしまいそうな人',
  '寝取られたことがありそうな人','遊びで付き合っていそうな人','夜の街で声をかけられそうな人','風俗に興味はあるけど行けていなさそうな人',
  '裏アカでエッチな投稿をしていそうな人','エッチな漫画や小説を読んでいそうな人','エッチな話になると急に饒舌になりそうな人','エッチな話題で顔が赤くなりそうな人',
  'ムラムラしたら我慢できなさそうな人','ラブグッズをこっそり通販で買っていそうな人','エッチな話をしても動じなさそうな人','キスだけで満足しそうな人',
  'エッチのときに主導権を握りたがりそうな人','エッチのときに相手に任せたがりそうな人','エッチのあとに連絡が来なくなりそうな人','一夜限りの関係を何度も繰り返していそうな人'
];
const PD_CONTENT = {
  normal: {label:'通常のみ(下ネタなし)'},
  mixed:  {label:'通常+下ネタ'},
  adult:  {label:'下ネタのみ'}
};
const PD_TURN_OPTIONS = [5,10,20,30,50,0];   // 0 = エンドレス
let pdUsedPrompts = new Set();

/* お題のオン/オフ設定。オフにしたお題の文言を保存する(ブラウザに保存。使えない環境ではこのページを開いている間だけ有効) */
const PD_STORAGE_KEY = 'pdDisabledPrompts_v1';
let pdDisabled = { normal:new Set(), adult:new Set() };
let pdStorageOk = true;
function loadPdDisabled(){
  try{
    const raw = localStorage.getItem(PD_STORAGE_KEY);
    if(raw){ const o = JSON.parse(raw); pdDisabled.normal = new Set(o.normal || []); pdDisabled.adult = new Set(o.adult || []); }
  }catch(e){ pdStorageOk = false; }
}
function savePdDisabled(){
  try{ localStorage.setItem(PD_STORAGE_KEY, JSON.stringify({normal:[...pdDisabled.normal], adult:[...pdDisabled.adult]})); }
  catch(e){ pdStorageOk = false; }
}
loadPdDisabled();

function freshPd(){
  const n = 6;
  return {
    phase:'setup', n, names: getNames(n),
    order:'seq', content:'normal', turns:10,
    players:[], turn:0, curIdx:0, sub:'call', prompt:'', revealed:false,
    bag:[], lastIdx:null, history:[], promptTab:'normal'
  };
}
let pdState = freshPd();
function enterPd(){ appMode = 'pd'; pdState = carrySettings(pdState, freshPd(), ['n','order','content','turns','promptTab']); render(); }
function renderPdScreen(){
  const s = pdState;
  if(s.phase === 'setup') return screenPdSetup();
  if(s.phase === 'play') return screenPdPlay();
  if(s.phase === 'prompts') return screenPdPrompts();
  return screenPdEnd();
}

/* ---- setup ---- */
function screenPdSetup(){
  const s = pdState;
  const orderChips = [['seq','順番'],['random','ランダム']].map(([k,l])=>`<span class="chip pick ${s.order===k?'sel':''}" onclick="setPdOrder('${k}')">${l}</span>`).join('');
  const contentChips = Object.entries(PD_CONTENT).map(([k,c])=>`<span class="chip pick ${s.content===k?'sel':''}" onclick="setPdContent('${k}')">${c.label}</span>`).join('');
  const turnChips = PD_TURN_OPTIONS.map(t=>`<span class="chip pick ${s.turns===t?'sel':''}" onclick="setPdTurns(${t})">${t===0?'エンドレス':t+'個'}</span>`).join('');
  const nameRows = s.names.map((nm,i)=>`
    <div class="nameitem"><div class="idx">${i+1}</div><input type="text" value="${escapeHtml(nm)}" oninput="setPdName(${i}, this.value)"></div>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow">偏見暴露ゲーム</div>
    <h1>ゲームの準備</h1>
    <p class="lead">手番の人だけがお題「この中で1番〇〇そうな人」を見て、思い浮かんだ人の名前を声に出して言います。お題は1/2の確率で全員に公開され、残りの1/2は闇に葬り去られます。</p>

    <label>参加人数(3〜20人)</label>
    <div class="stepper">
      <button onclick="changePdN(-1)">−</button>
      <div class="val">${s.n}</div>
      <button onclick="changePdN(1)">+</button>
    </div>

    <label>手番</label>
    <div class="chipwrap">${orderChips}</div>
    <p class="hint">${s.order==='seq' ? '名前の並び順に回します。' : '毎回、完全にランダムに決まります(同じ人が続けて当たることもあります)。'}</p>

    <label>お題の内容</label>
    <div class="chipwrap">${contentChips}</div>
    ${s.content!=='normal' ? `<p class="errtext" style="margin-top:0;">※ 直接的な性的表現を含みます。参加者全員の同意のうえで選んでください。</p>` : ''}

    <p class="hint">出題されるお題:${pdPool(s.content).length}個
      ${pdPool(s.content).length === 0 ? '<span class="errtext">(オンのお題がありません。お題設定でオンにしてください)</span>' : ''}</p>
    <button class="btn" onclick="pdOpenPrompts()">お題設定(お題ごとにオン/オフ)</button>

    <label>お題を出す数(ターン数)</label>
    <div class="chipwrap">${turnChips}</div>

    <label>参加者の名前</label>
    <div class="namegrid">${nameRows}</div>

    <button class="btn btn-primary" ${pdPool(s.content).length===0 ? 'disabled style="opacity:.4"' : ''} onclick="startPd()">ゲーム開始</button>
  </div>`;
}
function setPdOrder(k){ pdState.order = k; render(); }
function setPdContent(k){ pdState.content = k; render(); }
function setPdTurns(t){ pdState.turns = t; render(); }
function setPdName(i,v){ pdState.names[i] = v; setSharedName(i, v); }
function changePdN(d){
  const s = pdState;
  const n = Math.min(20, Math.max(3, s.n + d));
  if(n === s.n) return;
  s.n = n;
  s.names = getNames(n);
  render();
}
function pdEnabled(kind){ return (kind === 'normal' ? PD_NORMAL : PD_ADULT).filter(x=>!pdDisabled[kind].has(x)); }
function pdPool(content){
  // オンになっているお題だけが出題対象
  return content === 'normal' ? pdEnabled('normal') : content === 'adult' ? pdEnabled('adult') : [...pdEnabled('normal'), ...pdEnabled('adult')];
}
function drawPdPrompt(){
  const s = pdState;
  const pool = pdPool(s.content);
  let cands = pool.filter(x=>!pdUsedPrompts.has(x));
  if(cands.length === 0){ pool.forEach(x=>pdUsedPrompts.delete(x)); cands = pool; }
  const pick = cands[Math.floor(Math.random()*cands.length)];
  pdUsedPrompts.add(pick);
  return pick;
}
function nextPdPlayerIdx(turnNumber){
  const s = pdState;
  if(s.order === 'seq') return (turnNumber - 1) % s.players.length;
  // ランダム: 毎回完全にランダム(同じ人が続けて当たることもある)
  return Math.floor(Math.random() * s.players.length);
}
function startPd(){
  const s = pdState;
  if(pdPool(s.content).length === 0) return;
  s.players = s.names.map((nm,i)=>({id:i, name: nm.trim() || ('プレイヤー'+(i+1))}));
  s.turn = 0; s.bag = []; s.lastIdx = null; s.nextIdx = null; s.history = [];
  s.phase = 'play';
  beginPdTurn();
}
function beginPdTurn(){
  const s = pdState;
  s.turn += 1;
  // 直前の結果画面で次の人を決めている場合はその人、最初のターンはここで決める
  s.curIdx = (s.nextIdx !== null && s.nextIdx !== undefined) ? s.nextIdx : nextPdPlayerIdx(s.turn);
  s.nextIdx = null;
  s.prompt = drawPdPrompt();
  s.revealed = false;
  s.sub = 'call';
  render();
}

/* ---- play ---- */
function pdTurnLabel(){
  const s = pdState;
  return s.turns === 0 ? `第${s.turn}ターン(エンドレス)` : `第${s.turn}ターン / ${s.turns}`;
}
function screenPdPlay(){
  const s = pdState;
  const p = s.players[s.curIdx];
  if(s.sub === 'call'){
    return `
    <div class="panel callwrap">
      <div class="eyebrow">${pdTurnLabel()}</div>
      <div class="who">${san(p)}の番です</div>
      <div class="msg">${san(p)}:端末を受け取ったら、周りの人に画面が見えないようにしてから、${san(p)}自身がボタンを押してください。</div>
      <button class="btn btn-primary" onclick="pdShowPrompt()">お題を表示する</button>
    </div>`;
  }
  if(s.sub === 'prompt'){
    return `
    <div class="panel">
      <div class="eyebrow">${san(p)}のお題</div>
      <div class="card3d">
        <div class="cardface">
          <div class="small">この中で1番…</div>
          <div class="rolename" style="font-size:26px; line-height:1.5; margin:10px 0;">「${escapeHtml(s.prompt)}」</div>
          <div class="small">は?</div>
        </div>
      </div>
      <p class="hint">思い浮かんだ人の名前を、みんなに聞こえるように声に出して言ってください。(画面で選んだり入力したりはしません)</p>
      <button class="btn btn-primary" onclick="pdHide()">お題を隠して、端末を置く</button>
    </div>`;
  }
  if(s.sub === 'hold'){
    return `
    <div class="panel callwrap">
      <div class="eyebrow">お題は非表示です</div>
      <div class="who">端末を全員に見える場所に置いてください</div>
      <div class="msg">${san(p)}が「この中で1番〇〇そうな人」の名前を言いました。<br>ボタンを押すと、1/2の確率でお題が公開されます。(押す人は誰でも構いません)</div>
      <button class="btn btn-danger" onclick="pdFlip()">運命のボタンを押す</button>
    </div>`;
  }
  // result
  const isLast = s.turns !== 0 && s.turn >= s.turns;
  const next = isLast ? null : s.players[s.nextIdx];
  return `
  <div class="panel callwrap">
    <div class="eyebrow">${pdTurnLabel()}</div>
    ${s.revealed ? `
      <div class="roleicon pop-in">🔓</div>
      <div class="who" style="font-size:22px;">偏見が暴かれた!</div>
      <div class="small">この中で1番…</div>
      <div class="rolename pop-in" style="font-size:28px; line-height:1.5; margin:8px 0 14px;">「${escapeHtml(s.prompt)}」</div>
    ` : `
      <div class="roleicon pop-in">🕳️</div>
      <div class="who" style="font-size:22px;">偏見は闇に葬り去られた…</div>
      <div class="msg">お題は誰にも明かされません。</div>
    `}
    ${isLast
      ? `<button class="btn btn-primary" onclick="pdNext()">結果を見る</button>`
      : `<div class="msg" style="margin-bottom:14px;">次は${san(next)}の番です。端末を${san(next)}に渡してください。</div>
         <button class="btn btn-primary" onclick="pdNext()">次のプレイヤーへ</button>`}
    ${isLast ? '' : `<button class="btn btn-sub" onclick="pdEnd()">ここでゲームを終了する</button>`}
  </div>`;
}
function pdShowPrompt(){ pdState.sub = 'prompt'; render(); }
function pdHide(){ pdState.sub = 'hold'; render(); }
function pdFlip(){
  const s = pdState;
  s.revealed = Math.random() < 0.5;
  s.history.push({turn:s.turn, player:s.players[s.curIdx].name, prompt:s.prompt, revealed:s.revealed});
  // 結果画面に「次の人」の名前を出すため、次の手番をここで決めておく
  const isLast = s.turns !== 0 && s.turn >= s.turns;
  s.nextIdx = isLast ? null : nextPdPlayerIdx(s.turn + 1);
  s.sub = 'result';
  render();
}
function pdNext(){
  const s = pdState;
  if(s.turns !== 0 && s.turn >= s.turns){ pdEnd(); return; }
  beginPdTurn();
}
function pdEnd(){ pdState.nextIdx = null; pdState.phase = 'end'; render(); }

/* ---- お題設定(お題ごとにオン/オフ) ---- */
function pdOpenPrompts(){ pdState.phase = 'prompts'; render(); }
function pdPromptsBack(){ pdState.phase = 'setup'; render(); }
function setPdTab(k){ pdState.promptTab = k; render(); }
function screenPdPrompts(){
  const s = pdState;
  const kind = s.promptTab;
  const list = kind === 'normal' ? PD_NORMAL : PD_ADULT;
  const dis = pdDisabled[kind];
  const onCount = list.filter(x=>!dis.has(x)).length;
  const tabs = [['normal','通常',PD_NORMAL],['adult','下ネタ',PD_ADULT]].map(([k,l,arr])=>{
    const c = arr.filter(x=>!pdDisabled[k].has(x)).length;
    return `<span class="chip pick ${kind===k?'sel':''}" onclick="setPdTab('${k}')">${l}(${c}/${arr.length})</span>`;
  }).join('');
  const rows = list.map((x,i)=>`
    <div class="pdrow ${dis.has(x)?'off':''}" onclick="togglePdPrompt('${kind}', ${i}, this)">
      <span class="pdtext">「${escapeHtml(x)}」</span><span class="sw ${dis.has(x)?'':'on'}"></span>
    </div>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="pdPromptsBack()">← ゲームの準備に戻る</button>
    <div class="eyebrow">偏見暴露ゲーム</div>
    <h1>お題設定</h1>
    <p class="lead">出てほしくないお題はオフにしてください。オフのお題は出題されません。${pdStorageOk ? '設定はこの端末のブラウザに保存されます。' : '(この環境では保存できないため、ページを閉じるとリセットされます)'}</p>
    <div class="chipwrap">${tabs}</div>
    <p class="hint" id="pdOnCount">オン ${onCount} / ${list.length}個</p>
    <div class="row" style="gap:8px; margin-bottom:12px;">
      <button class="btn" style="margin:0;" onclick="pdSetAll('${kind}', true)">すべてオン</button>
      <button class="btn" style="margin:0;" onclick="pdSetAll('${kind}', false)">すべてオフ</button>
    </div>
    <div>${rows}</div>
    <button class="btn btn-primary" onclick="pdPromptsBack()">ゲームの準備に戻る</button>
  </div>`;
}
function togglePdPrompt(kind, i, el){
  const list = kind === 'normal' ? PD_NORMAL : PD_ADULT;
  const x = list[i];
  const dis = pdDisabled[kind];
  if(dis.has(x)) dis.delete(x); else dis.add(x);
  savePdDisabled();
  const off = dis.has(x);
  el.classList.toggle('off', off);
  const sw = el.querySelector('.sw'); if(sw) sw.classList.toggle('on', !off);
  const c = document.getElementById('pdOnCount');
  if(c) c.textContent = `オン ${list.filter(y=>!dis.has(y)).length} / ${list.length}個`;
}
function pdSetAll(kind, on){
  const list = kind === 'normal' ? PD_NORMAL : PD_ADULT;
  if(on) pdDisabled[kind].clear(); else list.forEach(x=>pdDisabled[kind].add(x));
  savePdDisabled();
  keepScroll(()=>render());
}

/* ---- end ---- */
function screenPdEnd(){
  const s = pdState;
  const shown = s.history.filter(h=>h.revealed);
  const buried = s.history.length - shown.length;
  const rows = shown.map(h=>`
    <div class="resultrow"><span class="rname" style="font-size:14px;">「${escapeHtml(h.prompt)}」</span><span class="small">${escapeHtml(h.player)}さん</span></div>`).join('');
  return `
  <div class="panel">
    <button class="backlink" onclick="backToTop()">← トップに戻る</button>
    <div class="eyebrow center" style="text-align:center;">ゲーム終了</div>
    <h1 class="center" style="text-align:center;">お疲れさまでした</h1>
    <p class="lead center" style="text-align:center;">お題 ${s.history.length}個:公開 ${shown.length}個 / 闇に葬られた ${buried}個</p>
    ${shown.length ? `<h3>公開されたお題</h3><div class="resultlist">${rows}</div>` : '<p class="hint" style="text-align:center;">公開されたお題はありませんでした。</p>'}
    <button class="btn btn-primary" onclick="startPd()">もう一度遊ぶ(同じ設定)</button>
    <button class="btn btn-sub" onclick="pdBackToSetup()">設定に戻る</button>
  </div>`;
}
function pdBackToSetup(){ pdState.phase = 'setup'; render(); }


render();
</script>
</body>
</html>
